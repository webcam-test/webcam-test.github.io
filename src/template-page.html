<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta name="author" content="{{SITE_NAME}}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <title>{{META_TITLE}}</title>

    <link rel="preload" href="/fonts/dm-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono-variable.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="icon" href="/favicon.ico">
    <meta name="theme-color" content="#f7f7fb">

    <style>{{CRITICAL_CSS}}</style>
    <link rel="preload" href="/typography.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="/styles.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="/typography.min.css">
        <link rel="stylesheet" href="/styles.min.css">
    </noscript>

    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
    {{GA_SNIPPET}}
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<header>
    <nav class="top-nav" aria-label="Primary navigation">
        <a href="/" class="logo">
            <span class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </span>
            <span>{{SITE_NAME}}</span>
        </a>
        <div class="category-strip">
            {{CATEGORY_DROPDOWNS}}{{MORE_MENU}}
        </div>
        <button type="button" class="nav-hamburger" id="navHamburgerBtn" aria-expanded="false" aria-controls="navDrawer" aria-label="Open menu">{{HAMBURGER_ICON}}</button>
    </nav>
</header>
{{MOBILE_DRAWER}}

<main id="main-content">
    {{BREADCRUMBS}}
    <section class="hero page-hero" aria-labelledby="page-title">
        <h1 id="page-title">{{H1}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
    </section>

    <section class="block">
        <div class="article">
            {{PAGE_CONTENT}}
        </div>
    </section>
</main>

<footer>
    <div class="footer-inner">
        <div class="footer-brand-row">
            <a href="/" class="footer-logo">
                <span class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </span>
                <span>{{SITE_NAME}}</span>
            </a>
            <p class="footer-tagline">{{FOOTER_TAGLINE}}</p>
        </div>
        <nav class="footer-mega" id="all-tools" aria-label="Site map">
            {{FOOTER_MEGA}}
        </nav>
        <div class="footer-bottom">
            <p>&copy; {{YEAR}} {{SITE_NAME}}. All rights reserved.</p>
            <nav aria-label="Footer links">
                <div class="footer-legal-links">
                    {{FOOTER_COMPANY}}
                </div>
            </nav>
        </div>
    </div>
</footer>

<script src="/nav.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var closeAll = initCategoryDropdowns();
    initPriorityNav(closeAll);
    initMobileDrawer();
    wrapTables();
  });
</script>
</body>
</html>
