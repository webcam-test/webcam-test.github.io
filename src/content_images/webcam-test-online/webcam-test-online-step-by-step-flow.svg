<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" style="width:100%;height:auto" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Five-step flow for running a webcam test online</title>
  <desc>Diagram showing the five steps of a webcam test online: open the tool, allow camera access, review the live feed, check FPS and resolution, and troubleshoot if the camera does not appear.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Five-step flow for running a webcam test online</dc:title>
        <dc:description>Diagram showing the five steps of a webcam test online: open the tool, allow camera access, review the live feed, check FPS and resolution, and troubleshoot if the camera does not appear.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam test online</rdf:li>
            <rdf:li>test your webcam</rdf:li>
            <rdf:li>camera access</rdf:li>
            <rdf:li>browser permissions</rdf:li>
            <rdf:li>troubleshooting</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1200" height="500" fill="#fcfcfb"/>
  <text x="40" y="50" font-size="26" font-weight="600" fill="#0b0b0b">How a webcam test online works</text>
  <text x="40" y="78" font-size="15" fill="#52514e">Five steps from opening the page to a working camera feed</text>

  <!-- connecting line -->
  <line x1="130" y1="230" x2="1070" y2="230" stroke="#c3c2b7" stroke-width="2"/>

  <!-- Step 1 -->
  <g>
    <circle cx="130" cy="230" r="34" fill="#2a78d6"/>
    <text x="130" y="239" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="50" y="290" width="160" height="130" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="130" y="320" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Open the tool</text>
    <text x="130" y="342" font-size="12" fill="#52514e" text-anchor="middle">
      <tspan x="130" dy="0">Load the webcam</tspan>
      <tspan x="130" dy="16">test online page and</tspan>
      <tspan x="130" dy="16">click Start Test</tspan>
    </text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle cx="365" cy="230" r="34" fill="#eb6834"/>
    <text x="365" y="239" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="285" y="290" width="160" height="130" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="365" y="320" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Allow camera access</text>
    <text x="365" y="342" font-size="12" fill="#52514e" text-anchor="middle">
      <tspan x="365" dy="0">Approve the browser</tspan>
      <tspan x="365" dy="16">permission prompt so</tspan>
      <tspan x="365" dy="16">the page can connect</tspan>
    </text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle cx="600" cy="230" r="34" fill="#1baf7a"/>
    <text x="600" y="239" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="520" y="290" width="160" height="130" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="600" y="320" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Review the live feed</text>
    <text x="600" y="342" font-size="12" fill="#52514e" text-anchor="middle">
      <tspan x="600" dy="0">Check lighting,</tspan>
      <tspan x="600" dy="16">sharpness and framing</tspan>
      <tspan x="600" dy="16">in the video preview</tspan>
    </text>
  </g>

  <!-- Step 4 -->
  <g>
    <circle cx="835" cy="230" r="34" fill="#eda100"/>
    <text x="835" y="239" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="755" y="290" width="160" height="130" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="835" y="320" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Check FPS &amp; resolution</text>
    <text x="835" y="342" font-size="12" fill="#52514e" text-anchor="middle">
      <tspan x="835" dy="0">Confirm frame rate,</tspan>
      <tspan x="835" dy="16">resolution and aspect</tspan>
      <tspan x="835" dy="16">ratio match your needs</tspan>
    </text>
  </g>

  <!-- Step 5 -->
  <g>
    <circle cx="1070" cy="230" r="34" fill="#4a3aa7"/>
    <text x="1070" y="239" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="990" y="290" width="160" height="130" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="1070" y="320" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Troubleshoot if needed</text>
    <text x="1070" y="342" font-size="12" fill="#52514e" text-anchor="middle">
      <tspan x="1070" dy="0">No image? Check app</tspan>
      <tspan x="1070" dy="16">conflicts, drivers and</tspan>
      <tspan x="1070" dy="16">system permissions</tspan>
    </text>
  </g>
</svg>
