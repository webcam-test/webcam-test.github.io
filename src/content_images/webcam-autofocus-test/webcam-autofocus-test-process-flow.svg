<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto" role="img" aria-labelledby="wat-flow-title wat-flow-desc">
<title id="wat-flow-title">Four-step webcam autofocus test process flow</title>
<desc id="wat-flow-desc">A horizontal step flow showing how to run a webcam autofocus test: allow camera access, hold a reference object at varying distances, watch the autofocus lock, then read the sharpness score.</desc>
<metadata>
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
           xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
    <rdf:Description rdf:about="">
      <dc:title>Webcam autofocus test process flow</dc:title>
      <dc:description>A horizontal step flow showing how to run a webcam autofocus test: allow camera access, hold a reference object at varying distances, watch the autofocus lock, then read the sharpness score.</dc:description>
      <dc:subject>
        <rdf:Bag>
          <rdf:li>webcam autofocus test</rdf:li>
          <rdf:li>test your webcam</rdf:li>
          <rdf:li>autofocus performance</rdf:li>
          <rdf:li>camera permission</rdf:li>
          <rdf:li>image sharpness</rdf:li>
        </rdf:Bag>
      </dc:subject>
      <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
    <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-autofocus-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
  </rdf:RDF>
</metadata>
<rect x="0" y="0" width="1000" height="460" fill="#fcfcfb"/>
<line x1="120" y1="120" x2="880" y2="120" stroke="#c3c2b7" stroke-width="2"/>

<!-- Step 1 -->
<circle cx="120" cy="120" r="34" fill="#2a78d6"/>
<text x="120" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="120" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">Allow Camera</text>
<text x="120" y="216" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">Access</text>
<text x="120" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">Grant browser</text>
<text x="120" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">permission to start</text>
<text x="120" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">the live preview</text>

<!-- Step 2 -->
<circle cx="373" cy="120" r="34" fill="#2a78d6"/>
<text x="373" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="373" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">Hold a Reference</text>
<text x="373" y="216" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">Object</text>
<text x="373" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">Move a printed page</text>
<text x="373" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">or card nearer and</text>
<text x="373" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">farther from the lens</text>

<!-- Step 3 -->
<circle cx="627" cy="120" r="34" fill="#2a78d6"/>
<text x="627" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="627" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">Watch the</text>
<text x="627" y="216" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">Focus Lock</text>
<text x="627" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">Note whether the</text>
<text x="627" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">image sharpens fast</text>
<text x="627" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">or visibly hunts</text>

<!-- Step 4 -->
<circle cx="880" cy="120" r="34" fill="#1baf7a"/>
<text x="880" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="880" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">Read Your</text>
<text x="880" y="216" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">Sharpness Score</text>
<text x="880" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">Compare the result</text>
<text x="880" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">against the Poor to</text>
<text x="880" y="288" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e" text-anchor="middle">Excellent bands</text>

<rect x="60" y="360" width="880" height="60" rx="8" fill="#f0efec"/>
<text x="500" y="396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#0b0b0b" text-anchor="middle">Run this webcam autofocus test in a well-lit room for the most reliable sharpness reading.</text>
</svg>
