<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
  <title>Speaker terminal wiring diagram for correct vs reversed polarity</title>
  <desc>Diagram of amplifier binding posts wired to two speaker terminals, showing the correct positive-to-positive and negative-to-negative connection alongside a reversed connection on one speaker that causes a failed speaker polarity test.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Speaker terminal wiring diagram for correct vs reversed polarity</dc:title>
        <dc:description>Diagram of amplifier binding posts wired to two speaker terminals, showing the correct positive-to-positive and negative-to-negative connection alongside a reversed connection on one speaker that causes a failed speaker polarity test.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>speaker polarity</rdf:li>
            <rdf:li>wiring</rdf:li>
            <rdf:li>speaker wires</rdf:li>
            <rdf:li>positive</rdf:li>
            <rdf:li>negative</rdf:li>
            <rdf:li>amplifier</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/speaker-polarity-phase-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect width="1000" height="620" fill="#fcfcfb" />
  <line x1="500" y1="30" x2="500" y2="590" stroke="#e1e0d9" stroke-width="2" />

  <!-- ============ LEFT: CORRECT ============ -->
  <g>
    <text x="60" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0ca30c">Correct: matched polarity</text>

    <!-- Amplifier -->
    <g transform="translate(60,100)">
      <rect x="0" y="0" width="140" height="90" rx="8" fill="#334155" />
      <text x="70" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">Amplifier</text>
      <circle cx="35" cy="30" r="9" fill="#d03b3b" />
      <text x="35" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcfcfb" font-weight="700">+</text>
      <circle cx="35" cy="60" r="9" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
      <text x="35" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcfcfb" font-weight="700">&#8722;</text>
      <circle cx="105" cy="30" r="9" fill="#d03b3b" />
      <text x="105" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcfcfb" font-weight="700">+</text>
      <circle cx="105" cy="60" r="9" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
      <text x="105" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcfcfb" font-weight="700">&#8722;</text>
    </g>

    <!-- Speaker L -->
    <g transform="translate(300,90)">
      <rect x="0" y="0" width="80" height="60" rx="6" fill="#475569" />
      <text x="40" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">Speaker L</text>
      <circle cx="20" cy="20" r="8" fill="#d03b3b" />
      <text x="20" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcfcfb" font-weight="700">+</text>
      <circle cx="20" cy="42" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
      <text x="20" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcfcfb" font-weight="700">&#8722;</text>
    </g>

    <!-- Speaker R -->
    <g transform="translate(300,210)">
      <rect x="0" y="0" width="80" height="60" rx="6" fill="#475569" />
      <text x="40" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">Speaker R</text>
      <circle cx="20" cy="20" r="8" fill="#d03b3b" />
      <text x="20" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcfcfb" font-weight="700">+</text>
      <circle cx="20" cy="42" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
      <text x="20" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcfcfb" font-weight="700">&#8722;</text>
    </g>

    <!-- Wires: amp -> L (+red to +, black to -) -->
    <path d="M 95 130 L 320 110" stroke="#d03b3b" stroke-width="3" fill="none" />
    <path d="M 95 160 L 320 132" stroke="#334155" stroke-width="3" fill="none" />
    <!-- Wires: amp -> R -->
    <path d="M 165 130 L 320 230" stroke="#d03b3b" stroke-width="3" fill="none" />
    <path d="M 165 160 L 320 252" stroke="#334155" stroke-width="3" fill="none" />

    <g transform="translate(60,320)">
      <rect x="0" y="0" width="380" height="120" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="2" />
      <path d="M20,30 L28,38 L44,18" stroke="#0ca30c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="58" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Every red wire lands on +</text>
      <text x="20" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">and every black wire lands on &#8722;,</text>
      <text x="20" y="87" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">on both the left and right speaker.</text>
      <text x="20" y="109" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0ca30c">The polarity test plays "in phase."</text>
    </g>
  </g>

  <!-- ============ RIGHT: REVERSED ============ -->
  <g transform="translate(500,0)">
    <text x="60" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#d03b3b">Reversed: one speaker flipped</text>

    <!-- Amplifier -->
    <g transform="translate(60,100)">
      <rect x="0" y="0" width="140" height="90" rx="8" fill="#334155" />
      <text x="70" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">Amplifier</text>
      <circle cx="35" cy="30" r="9" fill="#d03b3b" />
      <text x="35" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcfcfb" font-weight="700">+</text>
      <circle cx="35" cy="60" r="9" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
      <text x="35" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcfcfb" font-weight="700">&#8722;</text>
      <circle cx="105" cy="30" r="9" fill="#d03b3b" />
      <text x="105" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcfcfb" font-weight="700">+</text>
      <circle cx="105" cy="60" r="9" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
      <text x="105" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fcfcfb" font-weight="700">&#8722;</text>
    </g>

    <!-- Speaker L (correct) -->
    <g transform="translate(300,90)">
      <rect x="0" y="0" width="80" height="60" rx="6" fill="#475569" />
      <text x="40" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">Speaker L</text>
      <circle cx="20" cy="20" r="8" fill="#d03b3b" />
      <text x="20" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcfcfb" font-weight="700">+</text>
      <circle cx="20" cy="42" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
      <text x="20" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcfcfb" font-weight="700">&#8722;</text>
    </g>

    <!-- Speaker R (reversed terminals) -->
    <g transform="translate(300,210)">
      <rect x="0" y="0" width="80" height="60" rx="6" fill="#475569" />
      <text x="40" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">Speaker R</text>
      <circle cx="20" cy="20" r="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
      <text x="20" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcfcfb" font-weight="700">+</text>
      <circle cx="20" cy="42" r="8" fill="#d03b3b" />
      <text x="20" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcfcfb" font-weight="700">&#8722;</text>
    </g>

    <!-- Wires: amp -> L (correct) -->
    <path d="M 95 130 L 320 110" stroke="#d03b3b" stroke-width="3" fill="none" />
    <path d="M 95 160 L 320 132" stroke="#334155" stroke-width="3" fill="none" />
    <!-- Wires: amp -> R (black wire lands on + terminal, red on - terminal) -->
    <path d="M 165 160 L 320 230" stroke="#334155" stroke-width="3" fill="none" />
    <path d="M 165 130 L 320 252" stroke="#d03b3b" stroke-width="3" fill="none" />
    <circle cx="245" cy="195" r="5" fill="#eb6834" />

    <g transform="translate(60,320)">
      <rect x="0" y="0" width="380" height="120" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="2" />
      <path d="M20,20 L36,36 M36,20 L20,36" stroke="#d03b3b" stroke-width="3" fill="none" stroke-linecap="round" />
      <text x="52" y="33" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Speaker R's wires are swapped</text>
      <text x="20" y="63" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">&#8212; black lands on + and red on &#8722;,</text>
      <text x="20" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#52514e">opposite of Speaker L.</text>
      <text x="20" y="107" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#d03b3b">The polarity test plays "out of phase."</text>
    </g>
  </g>
</svg>
