<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
  <title>A-weighted, C-weighted, and Z-weighted frequency response curves</title>
  <desc>Line chart comparing the three frequency weighting curves a mic level meter can apply — dBA rolling off low and high frequencies to match human hearing, dBC staying nearly flat with a slight roll-off, and dBZ left completely unweighted.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>A-weighted, C-weighted, and Z-weighted frequency response curves</dc:title>
        <dc:description>Line chart comparing the three frequency weighting curves a mic level meter can apply — dBA rolling off low and high frequencies to match human hearing, dBC staying nearly flat with a slight roll-off, and dBZ left completely unweighted.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>frequency weighting</rdf:li>
            <rdf:li>dBA</rdf:li>
            <rdf:li>dBC</rdf:li>
            <rdf:li>dBZ</rdf:li>
            <rdf:li>sound level meter</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/microphone-input-level-meter</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="900" height="620" fill="#fcfcfb"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b0b0b">Frequency Weighting: A vs. C vs. Z</text>
  <text x="30" y="64" font-family="Arial, sans-serif" font-size="14" fill="#52514e">Relative response (dB) across the audible spectrum, 20 Hz – 20 kHz (log scale)</text>

  <!-- axes -->
  <line x1="90" y1="500" x2="860" y2="500" stroke="#c3c2b7" stroke-width="1"/>
  <line x1="90" y1="100" x2="90" y2="500" stroke="#c3c2b7" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#8a8981">
    <text x="90" y="520" text-anchor="middle">20Hz</text>
    <text x="240" y="520" text-anchor="middle">100Hz</text>
    <text x="410" y="520" text-anchor="middle">1kHz</text>
    <text x="600" y="520" text-anchor="middle">10kHz</text>
    <text x="820" y="520" text-anchor="middle">20kHz</text>
    <text x="75" y="120" text-anchor="end">+5</text>
    <text x="75" y="305" text-anchor="end">0</text>
    <text x="75" y="490" text-anchor="end">-40</text>
  </g>
  <line x1="90" y1="300" x2="860" y2="300" stroke="#e4e3dd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- dBZ: flat unweighted at 0dB reference -->
  <polyline points="90,300 200,300 300,300 410,300 520,300 630,300 740,300 860,300"
            fill="none" stroke="#1baf7a" stroke-width="2.5"/>
  <text x="770" y="290" font-family="Arial, sans-serif" font-size="13" fill="#0b0b0b" font-weight="bold">Z-Weighting (flat)</text>

  <!-- dBC: near-flat, rolls off at extremes -->
  <polyline points="90,420 200,330 300,305 410,300 520,300 630,305 740,320 860,360"
            fill="none" stroke="#eb6834" stroke-width="2.5"/>
  <text x="600" y="345" font-family="Arial, sans-serif" font-size="13" fill="#0b0b0b" font-weight="bold">C-Weighting</text>

  <!-- dBA: rolls off heavily at low freq, matches ear sensitivity, slight boost ~2-4kHz -->
  <polyline points="90,495 150,470 200,420 260,370 300,330 350,305 410,295 460,290 520,295 600,305 680,330 740,370 800,420 860,460"
            fill="none" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="460" y="270" font-family="Arial, sans-serif" font-size="13" fill="#0b0b0b" font-weight="bold">A-Weighting</text>

  <!-- legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#0b0b0b">
    <rect x="90" y="550" width="18" height="4" fill="#2a78d6"/>
    <text x="115" y="556">dBA — matches human hearing sensitivity</text>
    <rect x="90" y="575" width="18" height="4" fill="#eb6834"/>
    <text x="115" y="581">dBC — near-flat, used for peak/loud events</text>
    <rect x="470" y="550" width="18" height="4" fill="#1baf7a"/>
    <text x="495" y="556">dBZ — unweighted, raw sound pressure</text>
  </g>
</svg>
