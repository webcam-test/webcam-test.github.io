<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto" role="img" aria-labelledby="mpTitle mpDesc">
  <title id="mpTitle">Diagram showing how webcam megapixel count is calculated from resolution</title>
  <desc id="mpDesc">Formula diagram showing that a webcam's pixel width multiplied by its pixel height equals total pixels, which divided by one million equals megapixels, worked through with a 1920×1080 example.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Diagram showing how webcam megapixel count is calculated from resolution</dc:title>
        <dc:description>Formula diagram showing that a webcam's pixel width multiplied by its pixel height equals total pixels, which divided by one million equals megapixels, worked through with a 1920×1080 example.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam max resolution</rdf:li>
            <rdf:li>megapixels</rdf:li>
            <rdf:li>camera resolution</rdf:li>
            <rdf:li>pixels</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-maximum-resolution-detector</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="900" height="500" fill="#fcfcfb"/>

  <text x="60" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0b0b0b">How Webcam Megapixels Are Calculated</text>

  <!-- Step 1 box: Width -->
  <rect x="60" y="110" width="180" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">Width (px)</text>
  <text x="150" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0b0b0b">1920</text>

  <text x="255" y="165" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#898781">×</text>

  <!-- Step 2 box: Height -->
  <rect x="290" y="110" width="180" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="380" y="145" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">Height (px)</text>
  <text x="380" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0b0b0b">1080</text>

  <text x="485" y="165" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#898781">=</text>

  <!-- Result box: total pixels -->
  <rect x="520" y="110" width="320" height="90" rx="8" fill="#2a78d6"/>
  <text x="680" y="145" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e8f1fc">Total Pixels</text>
  <text x="680" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#ffffff">2,073,600</text>

  <!-- arrow down -->
  <line x1="680" y1="200" x2="680" y2="250" stroke="#c3c2b7" stroke-width="2"/>
  <polygon points="680,262 671,246 689,246" fill="#c3c2b7"/>

  <text x="500" y="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#52514e">÷ 1,000,000 =</text>

  <!-- Final result: megapixels -->
  <rect x="560" y="270" width="280" height="90" rx="8" fill="#1baf7a"/>
  <text x="700" y="305" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e6f8f1">Megapixels (MP)</text>
  <text x="700" y="335" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffffff">2.07 MP</text>

  <text x="60" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">Example: a 1080p Full HD webcam (1920 × 1080 pixels) captures 2,073,600 total pixels —</text>
  <text x="60" y="445" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">rounded off as roughly 2 megapixels, the figure manufacturers list as camera resolution.</text>
</svg>
