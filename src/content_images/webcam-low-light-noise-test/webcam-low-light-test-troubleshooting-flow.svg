<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle4 svgDesc4">
  <title id="svgTitle4">Four-step webcam low light test troubleshooting flow</title>
  <desc id="svgDesc4">Step-flow diagram showing the four steps of running a webcam low light test: start the test and check the brightness score, adjust the light source, retest, then confirm the score lands in the optimal range.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Four-step webcam low light test troubleshooting flow</dc:title>
        <dc:description>Step-flow diagram showing the four steps of running a webcam low light test and fixing a low brightness score.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam low light test</rdf:li>
            <rdf:li>brightness score</rdf:li>
            <rdf:li>troubleshooting</rdf:li>
            <rdf:li>camera access</rdf:li>
            <rdf:li>light source</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-low-light-noise-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1000" height="380" fill="#fcfcfb"/>
  <text x="500" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0b0b0b">Webcam Low Light Test: Troubleshooting Flow</text>
  <text x="500" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">Four steps from a low brightness score to a passing one</text>

  <!-- connecting line -->
  <line x1="140" y1="200" x2="860" y2="200" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="0"/>

  <!-- Step 1 -->
  <circle cx="140" cy="200" r="44" fill="#2a78d6"/>
  <text x="140" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
  <text x="140" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">Start the test</text>
  <text x="140" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Allow camera access</text>
  <text x="140" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">and read the score</text>

  <!-- arrow -->
  <polygon points="330,200 314,192 314,208" fill="#898781"/>

  <!-- Step 2 -->
  <circle cx="380" cy="200" r="44" fill="#eb6834"/>
  <text x="380" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
  <text x="380" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">Adjust the light</text>
  <text x="380" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Add a front-facing source</text>
  <text x="380" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">or reduce backlight</text>

  <!-- arrow -->
  <polygon points="570,200 554,192 554,208" fill="#898781"/>

  <!-- Step 3 -->
  <circle cx="620" cy="200" r="44" fill="#1baf7a"/>
  <text x="620" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff">3</text>
  <text x="620" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">Retest</text>
  <text x="620" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Rerun the test and</text>
  <text x="620" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">compare brightness scores</text>

  <!-- arrow -->
  <polygon points="810,200 794,192 794,208" fill="#898781"/>

  <!-- Step 4 -->
  <circle cx="860" cy="200" r="44" fill="#0ca30c"/>
  <text x="860" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffffff">4</text>
  <text x="860" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">Confirm the score</text>
  <text x="860" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Lands in the optimal</text>
  <text x="860" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">range before your call</text>

  <text x="500" y="355" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781">Repeat steps 2-3 until the brightness score reads in the optimal band</text>
</svg>
