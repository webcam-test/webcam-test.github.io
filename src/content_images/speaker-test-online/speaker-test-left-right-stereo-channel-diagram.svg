<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Left/right stereo channel diagram for a speaker test</title>
  <desc id="svgDesc">Diagram showing a browser-based speaker test sending a distinct tone to the left speaker (blue) and a distinct tone to the right speaker (orange), so a listener can confirm each channel is wired to the correct side.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Left/right stereo channel diagram for a speaker test</dc:title>
        <dc:description>Diagram showing a browser-based speaker test sending a distinct tone to the left speaker (blue) and a distinct tone to the right speaker (orange), so a listener can confirm each channel is wired to the correct side.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>speaker test</rdf:li>
            <rdf:li>stereo test</rdf:li>
            <rdf:li>left right channels</rdf:li>
            <rdf:li>stereo balance</rdf:li>
            <rdf:li>audio output</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/speaker-test-online</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect width="900" height="600" fill="#fcfcfb" />

  <!-- Browser / test tool in center -->
  <g transform="translate(350,250)">
    <rect x="0" y="0" width="200" height="130" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="2" />
    <rect x="0" y="0" width="200" height="24" rx="10" fill="#e1e0d9" />
    <circle cx="16" cy="12" r="4" fill="#e34948" />
    <circle cx="32" cy="12" r="4" fill="#eda100" />
    <circle cx="48" cy="12" r="4" fill="#1baf7a" />
    <text x="100" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Speaker Test</text>
    <!-- Left / Right buttons -->
    <g transform="translate(24,80)">
      <circle cx="0" cy="0" r="22" fill="#2a78d6" />
      <path d="M6,-10 L-8,0 L6,10 Z" fill="#ffffff" />
      <text x="0" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e" text-anchor="middle">Left</text>
    </g>
    <g transform="translate(176,80)">
      <circle cx="0" cy="0" r="22" fill="#eb6834" />
      <path d="M-6,-10 L8,0 L-6,10 Z" fill="#ffffff" />
      <text x="0" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e" text-anchor="middle">Right</text>
    </g>
  </g>

  <!-- Left speaker -->
  <g transform="translate(80,220)">
    <rect x="0" y="0" width="140" height="190" rx="8" fill="#334155" />
    <circle cx="70" cy="50" r="22" fill="#475569" />
    <circle cx="70" cy="50" r="10" fill="#0f172a" />
    <circle cx="70" cy="130" r="42" fill="#475569" />
    <circle cx="70" cy="130" r="26" fill="#334155" />
    <circle cx="70" cy="130" r="10" fill="#0f172a" />
    <text x="70" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#2a78d6" text-anchor="middle">Left Channel</text>
  </g>

  <!-- Right speaker -->
  <g transform="translate(680,220)">
    <rect x="0" y="0" width="140" height="190" rx="8" fill="#334155" />
    <circle cx="70" cy="50" r="22" fill="#475569" />
    <circle cx="70" cy="50" r="10" fill="#0f172a" />
    <circle cx="70" cy="130" r="42" fill="#475569" />
    <circle cx="70" cy="130" r="26" fill="#334155" />
    <circle cx="70" cy="130" r="10" fill="#0f172a" />
    <text x="70" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#eb6834" text-anchor="middle">Right Channel</text>
  </g>

  <!-- Sound wave paths from center tool to left speaker -->
  <path d="M350,300 Q280,290 220,290" fill="none" stroke="#2a78d6" stroke-width="3" opacity="0.85" />
  <path d="M350,315 Q270,320 220,320" fill="none" stroke="#2a78d6" stroke-width="3" opacity="0.6" />
  <path d="M350,330 Q270,345 220,350" fill="none" stroke="#2a78d6" stroke-width="3" opacity="0.4" />

  <!-- Sound wave paths from center tool to right speaker -->
  <path d="M550,300 Q620,290 680,290" fill="none" stroke="#eb6834" stroke-width="3" opacity="0.85" />
  <path d="M550,315 Q630,320 680,320" fill="none" stroke="#eb6834" stroke-width="3" opacity="0.6" />
  <path d="M550,330 Q630,345 680,350" fill="none" stroke="#eb6834" stroke-width="3" opacity="0.4" />

  <text x="450" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Left/Right Stereo Channel Test</text>
  <text x="450" y="95" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#52514e" text-anchor="middle">Click Left to confirm sound only comes from the left speaker, then Right for the right speaker</text>
</svg>
