<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" style="width:100%;height:auto" role="img" aria-labelledby="fctTroubleTitle fctTroubleDesc">
  <title id="fctTroubleTitle">Front camera test troubleshooting flowchart</title>
  <desc id="fctTroubleDesc">Flowchart mapping five common reasons a front camera test fails — permission denied, camera in use by another app, disabled system settings, driver issues, and hardware failure — to their fix.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Front camera test troubleshooting flowchart</dc:title>
        <dc:description>Flowchart mapping five common reasons a front camera test fails — permission denied, camera in use by another app, disabled system settings, driver issues, and hardware failure — to their fix.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>front camera test</rdf:li>
            <rdf:li>webcam not working</rdf:li>
            <rdf:li>camera permission</rdf:li>
            <rdf:li>driver issues</rdf:li>
            <rdf:li>troubleshooting</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/front-camera-test-online</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="960" height="660" fill="#fcfcfb"/>

  <!-- top node -->
  <rect x="20" y="20" width="220" height="60" rx="10" fill="#e34948"/>
  <text x="130" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Front camera test</text>
  <text x="130" y="66" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">failed?</text>

  <!-- trunk -->
  <line x1="130" y1="80" x2="130" y2="610" stroke="#c3c2b7" stroke-width="2"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
    <!-- Row 1 -->
    <line x1="130" y1="130" x2="150" y2="130" stroke="#c3c2b7" stroke-width="2"/>
    <rect x="150" y="100" width="230" height="60" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="265" y="126" fill="#0b0b0b" text-anchor="middle" font-weight="600">Browser permission</text>
    <text x="265" y="146" fill="#0b0b0b" text-anchor="middle" font-weight="600">denied</text>
    <path d="M380 130 L420 130" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="420" y="100" width="500" height="60" rx="8" fill="#cde2fb"/>
    <text x="440" y="124" fill="#0b0b0b">Click the camera icon in the address bar,</text>
    <text x="440" y="144" fill="#0b0b0b">choose "Allow," then refresh the page.</text>

    <!-- Row 2 -->
    <line x1="130" y1="230" x2="150" y2="230" stroke="#c3c2b7" stroke-width="2"/>
    <rect x="150" y="200" width="230" height="60" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="265" y="226" fill="#0b0b0b" text-anchor="middle" font-weight="600">Camera used by</text>
    <text x="265" y="246" fill="#0b0b0b" text-anchor="middle" font-weight="600">another app</text>
    <path d="M380 230 L420 230" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="420" y="200" width="500" height="60" rx="8" fill="#cde2fb"/>
    <text x="440" y="224" fill="#0b0b0b">Close Zoom, Teams, or any other app that</text>
    <text x="440" y="244" fill="#0b0b0b">already has the camera open, then retry.</text>

    <!-- Row 3 -->
    <line x1="130" y1="330" x2="150" y2="330" stroke="#c3c2b7" stroke-width="2"/>
    <rect x="150" y="300" width="230" height="60" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="265" y="326" fill="#0b0b0b" text-anchor="middle" font-weight="600">Disabled in system</text>
    <text x="265" y="346" fill="#0b0b0b" text-anchor="middle" font-weight="600">settings</text>
    <path d="M380 330 L420 330" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="420" y="300" width="500" height="60" rx="8" fill="#cde2fb"/>
    <text x="440" y="324" fill="#0b0b0b">Enable camera access for your browser in</text>
    <text x="440" y="344" fill="#0b0b0b">Windows or macOS privacy settings.</text>

    <!-- Row 4 -->
    <line x1="130" y1="430" x2="150" y2="430" stroke="#c3c2b7" stroke-width="2"/>
    <rect x="150" y="400" width="230" height="60" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="265" y="435" fill="#0b0b0b" text-anchor="middle" font-weight="600">Driver issues</text>
    <path d="M380 430 L420 430" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="420" y="400" width="500" height="60" rx="8" fill="#cde2fb"/>
    <text x="440" y="424" fill="#0b0b0b">Update or reinstall the camera driver</text>
    <text x="440" y="444" fill="#0b0b0b">through Device Manager.</text>

    <!-- Row 5 -->
    <line x1="130" y1="530" x2="150" y2="530" stroke="#c3c2b7" stroke-width="2"/>
    <rect x="150" y="500" width="230" height="60" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="265" y="535" fill="#0b0b0b" text-anchor="middle" font-weight="600">Hardware failure</text>
    <path d="M380 530 L420 530" stroke="#898781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="420" y="500" width="500" height="60" rx="8" fill="#cde2fb"/>
    <text x="440" y="524" fill="#0b0b0b">Try the camera on another computer to</text>
    <text x="440" y="544" fill="#0b0b0b">confirm — if it still fails, it's the hardware.</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="20" y="630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781">Work through each cause in order — most front camera test failures trace back to browser permissions.</text>
</svg>
