<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" style="width:100%;height:auto" role="img" aria-labelledby="fctStepTitle fctStepDesc">
  <title id="fctStepTitle">Front camera test step-by-step flow</title>
  <desc id="fctStepDesc">Five-step flow diagram showing how to run a front camera test: start the test, allow camera access, view the live preview, check resolution and FPS, then fix any issues found.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Front camera test step-by-step flow</dc:title>
        <dc:description>Five-step flow diagram showing how to run a front camera test: start the test, allow camera access, view the live preview, check resolution and FPS, then fix any issues found.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>front camera test</rdf:li>
            <rdf:li>test your camera</rdf:li>
            <rdf:li>camera access</rdf:li>
            <rdf:li>browser permission</rdf:li>
            <rdf:li>frame rate</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/front-camera-test-online</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1200" height="460" fill="#fcfcfb"/>
  <text x="40" y="46" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0b0b0b">How the front camera test runs, step by step</text>

  <!-- 5 step nodes -->
  <!-- positions -->
  <!-- node width 200, gap between centers 220, start x=100 -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- connecting line -->
    <line x1="150" y1="220" x2="1050" y2="220" stroke="#c3c2b7" stroke-width="2"/>

    <!-- Step 1 -->
    <circle cx="150" cy="220" r="34" fill="#2a78d6"/>
    <text x="150" y="229" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="150" y="300" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">Start Test</text>
    <text x="150" y="322" font-size="13" fill="#52514e" text-anchor="middle">Click "Start Camera"</text>

    <!-- Step 2 -->
    <circle cx="375" cy="220" r="34" fill="#2a78d6"/>
    <text x="375" y="229" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="375" y="300" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">Allow Access</text>
    <text x="375" y="322" font-size="13" fill="#52514e" text-anchor="middle">Grant camera permission</text>

    <!-- Step 3 -->
    <circle cx="600" cy="220" r="34" fill="#2a78d6"/>
    <text x="600" y="229" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="600" y="300" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">View Live Preview</text>
    <text x="600" y="322" font-size="13" fill="#52514e" text-anchor="middle">See the video feed</text>

    <!-- Step 4 -->
    <circle cx="825" cy="220" r="34" fill="#2a78d6"/>
    <text x="825" y="229" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="825" y="300" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">Check Resolution &amp; FPS</text>
    <text x="825" y="322" font-size="13" fill="#52514e" text-anchor="middle">Read the camera info panel</text>

    <!-- Step 5 -->
    <circle cx="1050" cy="220" r="34" fill="#1baf7a"/>
    <text x="1050" y="229" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="1050" y="300" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">Fix If Needed</text>
    <text x="1050" y="322" font-size="13" fill="#52514e" text-anchor="middle">Troubleshoot camera access</text>
  </g>

  <text x="40" y="410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781">Everything runs locally in your browser — no video is uploaded or stored.</text>
</svg>
