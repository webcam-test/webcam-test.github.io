<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle2 svgDesc2">
  <title id="svgTitle2">Three steps to start the webcam mirror test</title>
  <desc id="svgDesc2">A step flow diagram showing three steps: allow camera access in the browser, select your webcam from the device list, and view your mirrored image on screen.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Three steps to start the webcam mirror test</dc:title>
        <dc:description>A step flow diagram showing three steps: allow camera access in the browser, select your webcam from the device list, and view your mirrored image on screen.</dc:description>
        <dc:subject><rdf:Bag><rdf:li>webcam mirror test</rdf:li><rdf:li>camera access</rdf:li><rdf:li>webcam viewer</rdf:li><rdf:li>browser permission</rdf:li></rdf:Bag></dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-mirror-vs-natural-view-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1000" height="480" fill="#fcfcfb"/>
  <text x="500" y="52" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#0b0b0b">Starting the Webcam Mirror Test</text>

  <!-- connecting line -->
  <line x1="175" y1="230" x2="825" y2="230" stroke="#e1e0d9" stroke-width="4"/>

  <!-- Step 1 -->
  <g>
    <circle cx="175" cy="230" r="70" fill="#cde2fb"/>
    <circle cx="175" cy="230" r="70" fill="none" stroke="#2a78d6" stroke-width="3"/>
    <rect x="145" y="205" width="60" height="42" rx="6" fill="#2a78d6"/>
    <circle cx="175" cy="226" r="14" fill="#cde2fb"/>
    <circle cx="175" cy="226" r="8" fill="#2a78d6"/>
    <path d="M197 213 l14 -8 v34 l-14 -8 z" fill="#2a78d6"/>
    <circle cx="222" cy="192" r="13" fill="#1baf7a"/>
    <path d="M216 192 l4 5 l9 -10" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="175" y="330" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#2a78d6">STEP 1</text>
    <text x="175" y="356" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">Allow Camera Access</text>
    <text x="175" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Click "Allow" on the browser's</text>
    <text x="175" y="398" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">permission prompt</text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle cx="500" cy="230" r="70" fill="#fbdcc9"/>
    <circle cx="500" cy="230" r="70" fill="none" stroke="#eb6834" stroke-width="3"/>
    <rect x="463" y="208" width="74" height="44" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="3"/>
    <line x1="463" y1="228" x2="537" y2="228" stroke="#eb6834" stroke-width="2"/>
    <path d="M517 240 l8 8 l8 -8" stroke="#eb6834" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="500" y="330" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#eb6834">STEP 2</text>
    <text x="500" y="356" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">Select Your Webcam</text>
    <text x="500" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Pick a device if more than</text>
    <text x="500" y="398" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">one camera is detected</text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle cx="825" cy="230" r="70" fill="#c8ecdd"/>
    <circle cx="825" cy="230" r="70" fill="none" stroke="#1baf7a" stroke-width="3"/>
    <rect x="787" y="204" width="76" height="52" rx="6" fill="#ffffff" stroke="#1baf7a" stroke-width="3"/>
    <text x="825" y="238" text-anchor="middle" transform="translate(1650,0) scale(-1,1)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#1baf7a">R</text>
    <text x="825" y="330" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1baf7a">STEP 3</text>
    <text x="825" y="356" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">View Your Mirror Image</text>
    <text x="825" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Review lighting, framing, and</text>
    <text x="825" y="398" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">image quality on screen</text>
  </g>

  <text x="500" y="450" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781">Runs locally in your browser — no signup, no download</text>
</svg>
