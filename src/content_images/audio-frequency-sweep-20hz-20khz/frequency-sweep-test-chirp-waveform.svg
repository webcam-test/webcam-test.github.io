  <title id="chirpTitle">How a frequency sweep signal ramps from a low to a high frequency</title>
  <desc id="chirpDesc">A waveform diagram showing a swept sine tone whose cycles compress from wide and slow at the start frequency to narrow and fast at the end frequency, over a fixed duration.</desc>
