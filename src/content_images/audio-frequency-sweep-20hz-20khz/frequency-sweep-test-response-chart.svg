<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" style="width:100%;height:auto" role="img" aria-labelledby="respTitle respDesc"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title><rdf:Alt><rdf:li xml:lang="x-default">Reading a frequency sweep test's frequency response chart</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">A log-frequency response chart from 20 Hz to 20 kHz showing a flat reference line against a real measured curve with a dip and a resonance peak, illustrating what a frequency sweep test reveals about a system's response.</rdf:li></rdf:Alt></dc:description><Iptc4xmpExt:DigitalSourceType xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType><dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/audio-frequency-sweep-20hz-20khz</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description></rdf:RDF></metadata>
  <title id="respTitle">Reading a frequency sweep test's frequency response chart</title>
  <desc id="respDesc">A log-frequency response chart from 20 Hz to 20 kHz showing a flat reference line against a real measured curve with a dip and a resonance peak, illustrating what a frequency sweep test reveals about a system's response.</desc>
  <rect x="0" y="0" width="1000" height="560" fill="#fcfcfb"/>

  <text x="500" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#0b0b0b">What a Frequency Sweep Test Reveals</text>
  <text x="500" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">A flat response line means uniform output; dips and peaks flag room modes and resonances</text>

  <g transform="translate(80,110)">
    <!-- gridlines -->
    <line x1="0" y1="0" x2="0" y2="240" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="195.7" y1="0" x2="195.7" y2="240" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="475.7" y1="0" x2="475.7" y2="240" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="755.7" y1="0" x2="755.7" y2="240" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="240" stroke="#e1e0d9" stroke-width="1"/>

    <!-- 0 dB flat reference -->
    <line x1="0" y1="101.5" x2="840" y2="101.5" stroke="#898781" stroke-width="2" stroke-dasharray="6,6"/>
    <text x="844" y="106" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781">0 dB (flat)</text>

    <!-- baseline axis -->
    <line x1="0" y1="240" x2="840" y2="240" stroke="#c3c2b7" stroke-width="2"/>

    <!-- measured response curve -->
    <path d="M 0.0,107.6 L 22.4,96.8 L 44.8,91.4 L 67.2,97.4 L 89.6,108.1 L 112.0,111.4 L 134.4,103.5 L 156.8,93.5 L 179.2,92.7 L 201.6,104.1 L 224.0,123.6 L 246.4,149.5 L 268.8,170.1 L 280.0,170.4 L 291.2,162.5 L 313.6,135.4 L 336.0,118.9 L 358.4,114.0 L 380.8,106.1 L 403.2,95.2 L 425.6,91.6 L 448.0,99.2 L 470.4,109.1 L 492.8,109.1 L 515.2,95.9 L 537.6,77.2 L 560.0,62.3 L 582.4,54.7 L 604.8,52.5 L 609.3,52.5 L 627.2,53.6 L 649.6,58.9 L 672.0,71.0 L 694.4,90.1 L 716.8,110.0 L 739.2,122.0 L 761.6,123.8 L 784.0,122.3 L 806.4,125.8 L 828.8,133.3 L 840.0,135.7"
          fill="none" stroke="#2a78d6" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- dip marker -->
    <circle cx="280.0" cy="170.4" r="6" fill="#e34948"/>
    <line x1="280.0" y1="170.4" x2="280.0" y2="255" stroke="#e34948" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- peak marker -->
    <circle cx="609.3" cy="52.5" r="6" fill="#eb6834"/>
    <line x1="609.3" y1="52.5" x2="609.3" y2="255" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- x-axis labels -->
    <text x="0" y="264" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">20 Hz</text>
    <text x="195.7" y="264" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">100 Hz</text>
    <text x="475.7" y="264" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">1 kHz</text>
    <text x="755.7" y="264" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">10 kHz</text>
    <text x="840" y="264" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">20 kHz</text>
  </g>

  <!-- callouts -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="270" y="390" width="230" height="70" fill="#fcfcfb" stroke="#e34948" stroke-width="1.5" rx="6"/>
    <text x="285" y="414" font-size="15" font-weight="700" fill="#e34948">Dip near 200 Hz</text>
    <text x="285" y="436" font-size="13" fill="#52514e">Often a room mode or</text>
    <text x="285" y="452" font-size="13" fill="#52514e">phase cancellation</text>

    <rect x="560" y="390" width="240" height="70" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5" rx="6"/>
    <text x="575" y="414" font-size="15" font-weight="700" fill="#eb6834">Peak near 3 kHz</text>
    <text x="575" y="436" font-size="13" fill="#52514e">A resonance the sweep</text>
    <text x="575" y="452" font-size="13" fill="#52514e">exposed at that frequency</text>
  </g>

  <text x="500" y="510" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#898781">Run the sweep, watch where the curve strays from the flat 0 dB line, and you've found your problem frequencies</text>
</svg>
