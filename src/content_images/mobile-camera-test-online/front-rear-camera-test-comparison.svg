<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;height:auto" aria-labelledby="mct-fr-title mct-fr-desc">
  <title id="mct-fr-title">Front vs rear camera test checks</title>
  <desc id="mct-fr-desc">A two-column comparison of what a front camera test and a rear camera test each verify: lens detection, focus, resolution, and typical use case.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Front vs rear camera test checks</dc:title>
        <dc:description>A two-column comparison of what a front camera test and a rear camera test each verify: lens detection, focus, resolution, and typical use case.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>front camera test</rdf:li>
            <rdf:li>mobile camera tester</rdf:li>
            <rdf:li>front and rear camera</rdf:li>
            <rdf:li>camera resolution</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/mobile-camera-test-online</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="820" height="460" fill="#fcfcfb"/>

  <!-- Column headers -->
  <rect x="30" y="20" width="360" height="56" rx="10" fill="#2a78d6"/>
  <text x="210" y="55" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#ffffff">Front Camera Test</text>

  <rect x="430" y="20" width="360" height="56" rx="10" fill="#eb6834"/>
  <text x="610" y="55" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#ffffff">Rear Camera Test</text>

  <!-- Row separators -->
  <line x1="30" y1="76" x2="790" y2="76" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 1: Detection -->
  <text x="30" y="112" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Lens detected</text>
  <text x="30" y="132" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Selfie lens responds and streams</text>
  <text x="430" y="112" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Lens detected</text>
  <text x="430" y="132" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Rear lens responds and streams</text>
  <line x1="30" y1="150" x2="790" y2="150" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 2: Resolution -->
  <text x="30" y="186" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Typical resolution</text>
  <text x="30" y="206" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Usually negotiates lower than rear</text>
  <text x="430" y="186" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Typical resolution</text>
  <text x="430" y="206" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Usually negotiates higher, 1080p+</text>
  <line x1="30" y1="224" x2="790" y2="224" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 3: Focus -->
  <text x="30" y="260" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Focus behavior</text>
  <text x="30" y="280" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Often fixed-focus, tuned for faces</text>
  <text x="430" y="260" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Focus behavior</text>
  <text x="430" y="280" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Autofocus hunts in low light</text>
  <line x1="30" y1="298" x2="790" y2="298" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 4: Flash -->
  <text x="30" y="334" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Torch / flash</text>
  <text x="30" y="354" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Not available on the selfie lens</text>
  <text x="430" y="334" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Torch / flash</text>
  <text x="430" y="354" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Available on select Android devices</text>
  <line x1="30" y1="372" x2="790" y2="372" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Row 5: Use case -->
  <text x="30" y="408" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Best for</text>
  <text x="30" y="428" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Video calls, webcam-style checks</text>
  <text x="430" y="408" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b">Best for</text>
  <text x="430" y="428" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e">Photo detail, buying-a-phone checks</text>
</svg>
