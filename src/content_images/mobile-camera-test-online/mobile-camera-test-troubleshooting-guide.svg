<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;height:auto" aria-labelledby="mct-fix-title mct-fix-desc">
  <title id="mct-fix-title">Six common mobile camera test failures and fixes</title>
  <desc id="mct-fix-desc">A grid of six common problems a mobile camera test reveals — access denied, blurry feed, low frame rate, switch camera failure, unsupported torch, and low resolution — each paired with a short fix.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Six common mobile camera test failures and fixes</dc:title>
        <dc:description>A grid of six common problems a mobile camera test reveals — access denied, blurry feed, low frame rate, switch camera failure, unsupported torch, and low resolution — each paired with a short fix.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>mobile camera test</rdf:li>
            <rdf:li>camera permission</rdf:li>
            <rdf:li>frame rate</rdf:li>
            <rdf:li>troubleshooting</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/mobile-camera-test-online</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="960" height="480" fill="#fcfcfb"/>

  <!-- Row 1 -->
  <g>
    <rect x="20" y="20" width="290" height="210" rx="12" fill="#f0efec" stroke="#e1e0d9"/>
    <rect x="20" y="20" width="6" height="210" rx="3" fill="#d03b3b"/>
    <circle cx="60" cy="60" r="14" fill="#d03b3b"/>
    <text x="60" y="65" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#ffffff">!</text>
    <text x="86" y="65" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Access Denied</text>
    <text x="45" y="100" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#52514e"><tspan x="45" dy="0">A browser permission</tspan><tspan x="45" dy="17">was blocked.</tspan></text>
    <text x="45" y="150" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#184f95"><tspan x="45" dy="0">Fix: allow camera access</tspan><tspan x="45" dy="17">in site settings, reload.</tspan></text>
  </g>

  <g>
    <rect x="335" y="20" width="290" height="210" rx="12" fill="#f0efec" stroke="#e1e0d9"/>
    <rect x="335" y="20" width="6" height="210" rx="3" fill="#d03b3b"/>
    <circle cx="375" cy="60" r="14" fill="#d03b3b"/>
    <text x="375" y="65" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#ffffff">!</text>
    <text x="401" y="65" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Blurry Feed</text>
    <text x="360" y="100" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#52514e"><tspan x="360" dy="0">Dirty lens, stuck focus,</tspan><tspan x="360" dy="17">or low light.</tspan></text>
    <text x="360" y="150" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#184f95"><tspan x="360" dy="0">Fix: wipe the lens, retest</tspan><tspan x="360" dy="17">in brighter light.</tspan></text>
  </g>

  <g>
    <rect x="650" y="20" width="290" height="210" rx="12" fill="#f0efec" stroke="#e1e0d9"/>
    <rect x="650" y="20" width="6" height="210" rx="3" fill="#fab219"/>
    <circle cx="690" cy="60" r="14" fill="#fab219"/>
    <text x="690" y="65" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">!</text>
    <text x="716" y="65" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Low Frame Rate</text>
    <text x="675" y="100" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#52514e"><tspan x="675" dy="0">Another app is using the</tspan><tspan x="675" dy="17">camera in the background.</tspan></text>
    <text x="675" y="150" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#184f95"><tspan x="675" dy="0">Fix: close background apps,</tspan><tspan x="675" dy="17">rerun the FPS check.</tspan></text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="20" y="250" width="290" height="210" rx="12" fill="#f0efec" stroke="#e1e0d9"/>
    <rect x="20" y="250" width="6" height="210" rx="3" fill="#fab219"/>
    <circle cx="60" cy="290" r="14" fill="#fab219"/>
    <text x="60" y="295" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">!</text>
    <text x="86" y="295" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Switch Fails</text>
    <text x="45" y="330" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#52514e"><tspan x="45" dy="0">Some devices only expose</tspan><tspan x="45" dy="17">one lens to the browser.</tspan></text>
    <text x="45" y="380" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#184f95"><tspan x="45" dy="0">Fix: check the "Cameras</tspan><tspan x="45" dy="17">Found" count, reload.</tspan></text>
  </g>

  <g>
    <rect x="335" y="250" width="290" height="210" rx="12" fill="#f0efec" stroke="#e1e0d9"/>
    <rect x="335" y="250" width="6" height="210" rx="3" fill="#898781"/>
    <circle cx="375" cy="290" r="14" fill="#898781"/>
    <text x="375" y="295" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#ffffff">!</text>
    <text x="401" y="295" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Torch Unsupported</text>
    <text x="360" y="330" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#52514e"><tspan x="360" dy="0">iOS Safari does not expose</tspan><tspan x="360" dy="17">torch control to web apps.</tspan></text>
    <text x="360" y="380" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#184f95"><tspan x="360" dy="0">Fix: expected on iOS —</tspan><tspan x="360" dy="17">works on select Android.</tspan></text>
  </g>

  <g>
    <rect x="650" y="250" width="290" height="210" rx="12" fill="#f0efec" stroke="#e1e0d9"/>
    <rect x="650" y="250" width="6" height="210" rx="3" fill="#d03b3b"/>
    <circle cx="690" cy="290" r="14" fill="#d03b3b"/>
    <text x="690" y="295" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#ffffff">!</text>
    <text x="716" y="295" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b">Low Resolution</text>
    <text x="675" y="330" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#52514e"><tspan x="675" dy="0">Reads below 720p —</tspan><tspan x="675" dy="17">degraded sensor or stream.</tspan></text>
    <text x="675" y="380" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#184f95"><tspan x="675" dy="0">Fix: close conflicting apps,</tspan><tspan x="675" dy="17">rerun the resolution check.</tspan></text>
  </g>
</svg>
