<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 620" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Webcam focus test image quality comparison</title>
  <desc id="svgDesc">Four side-by-side panels comparing common webcam focus test outcomes: sharp and in focus, blurry, grainy or noisy, and too dark, each labeled with its status and cause.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Webcam focus test image quality comparison</dc:title>
        <dc:description>Four side-by-side panels comparing common webcam focus test outcomes: sharp and in focus, blurry, grainy or noisy, and too dark, each labeled with its status and cause.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam focus test</rdf:li>
            <rdf:li>blurry image</rdf:li>
            <rdf:li>grainy image</rdf:li>
            <rdf:li>lighting conditions</rdf:li>
            <rdf:li>image quality</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-sharpness-focus-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1000" height="620" fill="#fcfcfb"/>
  <text x="500" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#0b0b0b">Four common webcam focus test outcomes</text>
  <text x="500" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">What each result looks like, and the most common cause</text>

  <!-- Panel template: x offsets 40, 280, 520, 760 ; width 220 -->
  <!-- Panel 1: Sharp & In Focus (good) -->
  <g>
    <rect x="40" y="110" width="220" height="220" rx="10" fill="#f9f9f7" stroke="#c3c2b7" stroke-width="2"/>
    <circle cx="150" cy="220" r="52" fill="none" stroke="#0b0b0b" stroke-width="2"/>
    <circle cx="150" cy="220" r="30" fill="none" stroke="#0b0b0b" stroke-width="2"/>
    <circle cx="150" cy="220" r="10" fill="#0b0b0b"/>
    <rect x="40" y="345" width="220" height="30" rx="6" fill="#0ca30c"/>
    <text x="150" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">✓ Sharp &amp; In Focus</text>
    <text x="150" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Clean lens, correct</text>
    <text x="150" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">focal distance</text>
  </g>

  <!-- Panel 2: Blurry (critical) -->
  <g>
    <rect x="280" y="110" width="220" height="220" rx="10" fill="#f9f9f7" stroke="#c3c2b7" stroke-width="2"/>
    <circle cx="390" cy="220" r="52" fill="none" stroke="#898781" stroke-width="6" opacity="0.55"/>
    <circle cx="390" cy="220" r="30" fill="none" stroke="#898781" stroke-width="6" opacity="0.55"/>
    <circle cx="390" cy="220" r="10" fill="#898781" opacity="0.55"/>
    <rect x="280" y="345" width="220" height="30" rx="6" fill="#d03b3b"/>
    <text x="390" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">✕ Blurry</text>
    <text x="390" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Dirty lens or wrong</text>
    <text x="390" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">focus distance</text>
  </g>

  <!-- Panel 3: Grainy / Noisy (serious) -->
  <g>
    <rect x="520" y="110" width="220" height="220" rx="10" fill="#f9f9f7" stroke="#c3c2b7" stroke-width="2"/>
    <circle cx="630" cy="220" r="52" fill="none" stroke="#0b0b0b" stroke-width="2"/>
    <circle cx="630" cy="220" r="30" fill="none" stroke="#0b0b0b" stroke-width="2"/>
    <circle cx="630" cy="220" r="10" fill="#0b0b0b"/>
    <g opacity="0.5">
      <circle cx="565" cy="150" r="1.6" fill="#52514e"/><circle cx="580" cy="175" r="1.6" fill="#52514e"/>
      <circle cx="700" cy="160" r="1.6" fill="#52514e"/><circle cx="690" cy="280" r="1.6" fill="#52514e"/>
      <circle cx="560" cy="290" r="1.6" fill="#52514e"/><circle cx="710" cy="200" r="1.6" fill="#52514e"/>
      <circle cx="600" cy="130" r="1.6" fill="#52514e"/><circle cx="655" cy="300" r="1.6" fill="#52514e"/>
      <circle cx="720" cy="250" r="1.6" fill="#52514e"/><circle cx="575" cy="250" r="1.6" fill="#52514e"/>
    </g>
    <rect x="520" y="345" width="220" height="30" rx="6" fill="#ec835a"/>
    <text x="630" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">! Grainy / Noisy</text>
    <text x="630" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Low light forcing a</text>
    <text x="630" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">high sensor gain</text>
  </g>

  <!-- Panel 4: Too Dark (serious) -->
  <g>
    <rect x="760" y="110" width="220" height="220" rx="10" fill="#2c2c2a" stroke="#c3c2b7" stroke-width="2"/>
    <circle cx="870" cy="220" r="52" fill="none" stroke="#52514e" stroke-width="2"/>
    <circle cx="870" cy="220" r="30" fill="none" stroke="#52514e" stroke-width="2"/>
    <circle cx="870" cy="220" r="10" fill="#52514e"/>
    <rect x="760" y="345" width="220" height="30" rx="6" fill="#ec835a"/>
    <text x="870" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">! Too Dark</text>
    <text x="870" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Insufficient light</text>
    <text x="870" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">reaching the sensor</text>
  </g>

  <text x="500" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#898781">A webcam focus test checks sharpness, lighting conditions, and noise levels together — not sharpness alone.</text>
</svg>
