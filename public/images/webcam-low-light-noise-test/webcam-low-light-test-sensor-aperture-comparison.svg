<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 520" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle3 svgDesc3">
  <title id="svgTitle3">Relative low-light capability by sensor size and aperture</title>
  <desc id="svgDesc3">Horizontal bar chart comparing relative low-light capability across three webcam sensor and aperture combinations: a small sensor with a narrow f/2.4 aperture, a standard sensor with an f/2.0 aperture, and a large sensor with a wide f/1.8 aperture.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Relative low-light capability by sensor size and aperture</dc:title>
        <dc:description>Horizontal bar chart comparing relative low-light capability across three webcam sensor and aperture combinations.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>low light webcam</rdf:li>
            <rdf:li>CMOS sensor</rdf:li>
            <rdf:li>aperture</rdf:li>
            <rdf:li>low-light performance</rdf:li>
            <rdf:li>image quality</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-low-light-noise-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="900" height="520" fill="#fcfcfb"/>
  <text x="450" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0b0b0b">Sensor Size &amp; Aperture vs Low-Light Capability</text>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">Relative capability score (0-100), larger sensor and wider aperture gather more light</text>

  <!-- gridlines -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="260" y1="130" x2="260" y2="440"/>
    <line x1="420" y1="130" x2="420" y2="440"/>
    <line x1="580" y1="130" x2="580" y2="440"/>
    <line x1="740" y1="130" x2="740" y2="440"/>
  </g>
  <line x1="260" y1="440" x2="820" y2="440" stroke="#c3c2b7" stroke-width="2"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781" text-anchor="middle">
    <text x="260" y="460">0</text>
    <text x="420" y="460">25</text>
    <text x="580" y="460">50</text>
    <text x="740" y="460">75</text>
  </g>

  <!-- Bar 1: small sensor, f/2.4 -->
  <rect x="260" y="150" width="196" height="60" rx="4" fill="#86b6ef"/>
  <text x="240" y="185" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b">Small sensor, f/2.4</text>
  <text x="466" y="185" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">35</text>

  <!-- Bar 2: standard sensor, f/2.0 -->
  <rect x="260" y="255" width="336" height="60" rx="4" fill="#3987e5"/>
  <text x="240" y="290" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b">Standard sensor, f/2.0</text>
  <text x="606" y="290" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">60</text>

  <!-- Bar 3: large sensor, f/1.8 -->
  <rect x="260" y="360" width="504" height="60" rx="4" fill="#184f95"/>
  <text x="240" y="395" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b">Large sensor, f/1.8</text>
  <text x="734" y="395" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">90</text>

  <text x="450" y="500" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781">Illustrative scoring based on how much light each sensor/aperture combination can gather in dim rooms</text>
</svg>
