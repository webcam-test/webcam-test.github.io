<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 640" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Backlit vs front-lit webcam setup diagram</title>
  <desc id="svgDesc">Side-by-side diagram comparing a backlit webcam setup, where a window behind the person causes a dark silhouette, against a front-lit setup, where a light source facing the person produces a correctly exposed face for a webcam low light test.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Backlit vs front-lit webcam setup diagram</dc:title>
        <dc:description>Side-by-side diagram comparing a backlit webcam setup against a front-lit setup for a webcam low light test.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam low light test</rdf:li>
            <rdf:li>low light webcam</rdf:li>
            <rdf:li>light source</rdf:li>
            <rdf:li>backlit</rdf:li>
            <rdf:li>front-facing light</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-low-light-noise-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1000" height="640" fill="#fcfcfb"/>
  <text x="500" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0b0b0b">Webcam Lighting Setup: Backlit vs Front-Lit</text>
  <text x="500" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">How light direction changes what a webcam low light test actually measures</text>

  <!-- divider -->
  <line x1="500" y1="100" x2="500" y2="600" stroke="#e1e0d9" stroke-width="2"/>

  <!-- ===== Panel A: Backlit (avoid) ===== -->
  <text x="250" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#d03b3b">Avoid — Backlit</text>

  <!-- room floor -->
  <rect x="60" y="520" width="380" height="8" rx="4" fill="#c3c2b7"/>

  <!-- window at back wall, behind person -->
  <rect x="80" y="180" width="90" height="150" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="3"/>
  <line x1="80" y1="255" x2="170" y2="255" stroke="#2a78d6" stroke-width="2"/>
  <line x1="125" y1="180" x2="125" y2="330" stroke="#2a78d6" stroke-width="2"/>
  <text x="125" y="350" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Bright window</text>

  <!-- light rays from window toward person's back -->
  <g stroke="#86b6ef" stroke-width="3" stroke-linecap="round">
    <line x1="170" y1="220" x2="240" y2="235"/>
    <line x1="170" y1="255" x2="240" y2="255"/>
    <line x1="170" y1="290" x2="240" y2="275"/>
  </g>

  <!-- person, seen from side, facing right toward monitor, window is behind (left) -->
  <circle cx="255" cy="250" r="30" fill="#52514e"/>
  <rect x="240" y="280" width="30" height="80" rx="10" fill="#52514e"/>

  <!-- monitor + webcam facing the person -->
  <rect x="340" y="240" width="80" height="55" rx="4" fill="#ffffff" stroke="#898781" stroke-width="2"/>
  <rect x="368" y="228" width="24" height="14" rx="4" fill="#0b0b0b"/>
  <circle cx="380" cy="235" r="3.5" fill="#eb6834"/>
  <rect x="370" y="295" width="20" height="30" fill="#898781"/>
  <rect x="345" y="325" width="70" height="8" rx="3" fill="#c3c2b7"/>

  <!-- camera view result: dark silhouette thumbnail -->
  <rect x="150" y="400" width="200" height="130" rx="8" fill="#0b0b0b"/>
  <circle cx="250" cy="440" r="22" fill="#2c2c2a"/>
  <rect x="235" y="462" width="30" height="45" rx="8" fill="#2c2c2a"/>
  <text x="250" y="545" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Webcam view: face underexposed</text>

  <!-- ===== Panel B: Front-lit (better) ===== -->
  <text x="750" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0ca30c">Better — Front-Lit</text>

  <rect x="560" y="520" width="380" height="8" rx="4" fill="#c3c2b7"/>

  <!-- window at back wall, dimmed / curtained, behind person, not lighting them directly -->
  <rect x="580" y="180" width="90" height="150" rx="4" fill="#f0efec" stroke="#c3c2b7" stroke-width="3"/>
  <text x="625" y="350" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Window (blinds closed)</text>

  <!-- person -->
  <circle cx="755" cy="250" r="30" fill="#eda100"/>
  <rect x="740" y="280" width="30" height="80" rx="10" fill="#eda100"/>

  <!-- light source panel placed in front of person, facing their face -->
  <rect x="690" y="220" width="18" height="60" rx="4" fill="#0b0b0b"/>
  <circle cx="699" cy="215" r="16" fill="#fab219"/>
  <g stroke="#fab219" stroke-width="3" stroke-linecap="round">
    <line x1="715" y1="220" x2="740" y2="235"/>
    <line x1="715" y1="245" x2="740" y2="250"/>
    <line x1="715" y1="270" x2="740" y2="262"/>
  </g>
  <text x="699" y="300" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Front light</text>

  <!-- monitor + webcam -->
  <rect x="840" y="240" width="80" height="55" rx="4" fill="#ffffff" stroke="#898781" stroke-width="2"/>
  <rect x="868" y="228" width="24" height="14" rx="4" fill="#0b0b0b"/>
  <circle cx="880" cy="235" r="3.5" fill="#eb6834"/>
  <rect x="870" y="295" width="20" height="30" fill="#898781"/>
  <rect x="845" y="325" width="70" height="8" rx="3" fill="#c3c2b7"/>

  <!-- camera view result: well-lit thumbnail -->
  <rect x="650" y="400" width="200" height="130" rx="8" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/>
  <circle cx="750" cy="440" r="22" fill="#f2c98f"/>
  <rect x="735" y="462" width="30" height="45" rx="8" fill="#eda100"/>
  <text x="750" y="545" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Webcam view: face correctly exposed</text>

  <text x="500" y="615" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781">Rule of thumb: put the light source in front of your face, not behind it</text>
</svg>
