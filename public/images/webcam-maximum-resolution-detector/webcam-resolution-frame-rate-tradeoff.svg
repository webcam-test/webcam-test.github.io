<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto" role="img" aria-labelledby="frTitle frDesc">
  <title id="frTitle">Bar chart showing the trade-off between webcam resolution and maximum frame rate</title>
  <desc id="frDesc">Vertical bar chart showing that as webcam resolution increases from 720p to 1080p to 4K, the maximum achievable frame rate drops from 90fps to 60fps to 30fps.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Bar chart showing the trade-off between webcam resolution and maximum frame rate</dc:title>
        <dc:description>Vertical bar chart showing that as webcam resolution increases from 720p to 1080p to 4K, the maximum achievable frame rate drops from 90fps to 60fps to 30fps.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam max resolution</rdf:li>
            <rdf:li>frame rate</rdf:li>
            <rdf:li>fps</rdf:li>
            <rdf:li>4K webcam</rdf:li>
            <rdf:li>1080p webcam</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-maximum-resolution-detector</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="900" height="550" fill="#fcfcfb"/>

  <text x="60" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0b0b0b">Resolution vs. Maximum Frame Rate</text>
  <text x="60" y="83" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">Typical fps ceiling most webcam sensors can sustain at each resolution</text>

  <!-- baseline -->
  <line x1="130" y1="450" x2="790" y2="450" stroke="#c3c2b7" stroke-width="2"/>

  <!-- Bar 1: 720p HD, 90fps -->
  <rect x="190" y="170" width="120" height="280" rx="4" fill="#2a78d6"/>
  <text x="250" y="155" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b">90 fps</text>
  <text x="250" y="478" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">720p HD</text>
  <text x="250" y="500" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781">1280 × 720</text>

  <!-- Bar 2: 1080p FHD, 60fps -->
  <rect x="390" y="263" width="120" height="187" rx="4" fill="#2a78d6"/>
  <text x="450" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b">60 fps</text>
  <text x="450" y="478" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">1080p Full HD</text>
  <text x="450" y="500" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781">1920 × 1080</text>

  <!-- Bar 3: 4K UHD, 30fps -->
  <rect x="590" y="357" width="120" height="93" rx="4" fill="#2a78d6"/>
  <text x="650" y="342" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0b0b0b">30 fps</text>
  <text x="650" y="478" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">4K Ultra HD</text>
  <text x="650" y="500" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781">3840 × 2160</text>

  <text x="60" y="535" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#898781">Higher resolution means more pixels to process per frame, which caps the achievable frame rate.</text>
</svg>
