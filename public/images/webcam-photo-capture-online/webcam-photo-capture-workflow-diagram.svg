<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif">
  <title>Webcam photo capture workflow, five steps</title>
  <desc>Diagram showing the five-step flow of capturing a photo with a webcam: select camera, grant access, live preview, capture, and download.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Webcam photo capture workflow, five steps</dc:title>
        <dc:description>Diagram showing the five-step flow of capturing a photo with a webcam: select camera, grant access, live preview, capture, and download.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam photo capture</rdf:li>
            <rdf:li>take photo online</rdf:li>
            <rdf:li>live preview</rdf:li>
            <rdf:li>camera access</rdf:li>
            <rdf:li>download</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-photo-capture-online</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1200" height="420" fill="#fcfcfb"/>

  <!-- connecting line -->
  <line x1="130" y1="180" x2="1070" y2="180" stroke="#c3c2b7" stroke-width="2"/>

  <!-- Step 1 -->
  <g>
    <circle cx="130" cy="180" r="42" fill="#2a78d6"/>
    <text x="130" y="188" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">1</text>
    <text x="130" y="250" text-anchor="middle" fill="#0b0b0b" font-size="19" font-weight="bold">Select camera</text>
    <text x="130" y="274" text-anchor="middle" fill="#52514e" font-size="14">Choose webcam or</text>
    <text x="130" y="292" text-anchor="middle" fill="#52514e" font-size="14">phone camera</text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle cx="365" cy="180" r="42" fill="#eb6834"/>
    <text x="365" y="188" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">2</text>
    <text x="365" y="250" text-anchor="middle" fill="#0b0b0b" font-size="19" font-weight="bold">Grant access</text>
    <text x="365" y="274" text-anchor="middle" fill="#52514e" font-size="14">Allow camera</text>
    <text x="365" y="292" text-anchor="middle" fill="#52514e" font-size="14">permission in browser</text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle cx="600" cy="180" r="42" fill="#1baf7a"/>
    <text x="600" y="188" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">3</text>
    <text x="600" y="250" text-anchor="middle" fill="#0b0b0b" font-size="19" font-weight="bold">Live preview</text>
    <text x="600" y="274" text-anchor="middle" fill="#52514e" font-size="14">Frame the shot, set</text>
    <text x="600" y="292" text-anchor="middle" fill="#52514e" font-size="14">grid and mirror mode</text>
  </g>

  <!-- Step 4 -->
  <g>
    <circle cx="835" cy="180" r="42" fill="#eda100"/>
    <text x="835" y="188" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">4</text>
    <text x="835" y="250" text-anchor="middle" fill="#0b0b0b" font-size="19" font-weight="bold">Capture photo</text>
    <text x="835" y="274" text-anchor="middle" fill="#52514e" font-size="14">Press the shutter,</text>
    <text x="835" y="292" text-anchor="middle" fill="#52514e" font-size="14">self-timer optional</text>
  </g>

  <!-- Step 5 -->
  <g>
    <circle cx="1070" cy="180" r="42" fill="#4a3aa7"/>
    <text x="1070" y="188" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">5</text>
    <text x="1070" y="250" text-anchor="middle" fill="#0b0b0b" font-size="19" font-weight="bold">Save the image</text>
    <text x="1070" y="274" text-anchor="middle" fill="#52514e" font-size="14">Download as PNG,</text>
    <text x="1070" y="292" text-anchor="middle" fill="#52514e" font-size="14">JPG or WebP</text>
  </g>

  <text x="600" y="60" text-anchor="middle" fill="#0b0b0b" font-size="24" font-weight="bold">How webcam photo capture works</text>
  <text x="600" y="365" text-anchor="middle" fill="#52514e" font-size="13">Every step runs locally in the browser — nothing is uploaded to a server until you choose to share it.</text>
</svg>
