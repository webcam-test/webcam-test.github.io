<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto" font-family="Arial, Helvetica, sans-serif">
  <title>Framing guide for webcam photo capture with grid and face-detection crop box</title>
  <desc>Labeled diagram of a webcam preview frame showing a rule-of-thirds grid, an aspect-ratio crop boundary, and a face-detection box used to line up a photo before capture.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Framing guide for webcam photo capture</dc:title>
        <dc:description>Labeled diagram of a webcam preview frame showing a rule-of-thirds grid, an aspect-ratio crop boundary, and a face-detection box used to line up a photo before capture.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam photo capture</rdf:li>
            <rdf:li>face detection</rdf:li>
            <rdf:li>aspect ratio</rdf:li>
            <rdf:li>grid</rdf:li>
            <rdf:li>crop</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-photo-capture-online</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="900" height="620" fill="#fcfcfb"/>
  <text x="450" y="46" text-anchor="middle" fill="#0b0b0b" font-size="24" font-weight="bold">Frame it right before you capture</text>

  <!-- preview frame -->
  <rect x="200" y="80" width="500" height="440" fill="#e9e8e3" stroke="#52514e" stroke-width="2"/>

  <!-- rule of thirds grid -->
  <g stroke="#c3c2b7" stroke-width="1.5">
    <line x1="366" y1="80" x2="366" y2="520"/>
    <line x1="533" y1="80" x2="533" y2="520"/>
    <line x1="200" y1="226" x2="700" y2="226"/>
    <line x1="200" y1="373" x2="700" y2="373"/>
  </g>

  <!-- silhouette -->
  <circle cx="450" cy="240" r="70" fill="#d8d6cd"/>
  <rect x="380" y="300" width="140" height="180" rx="20" fill="#d8d6cd"/>

  <!-- face detection box -->
  <rect x="400" y="185" width="100" height="110" fill="none" stroke="#eda100" stroke-width="3"/>
  <text x="450" y="175" text-anchor="middle" fill="#eda100" font-size="14" font-weight="bold">Face-detection box</text>

  <!-- aspect ratio crop overlay (4:5 portrait inset) -->
  <rect x="230" y="95" width="440" height="410" fill="none" stroke="#2a78d6" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="230" y="82" fill="#2a78d6" font-size="14" font-weight="bold">Aspect-ratio crop boundary</text>

  <text x="700" y="230" fill="#008300" font-size="14" font-weight="bold">Rule-of-thirds</text>
  <text x="700" y="248" fill="#008300" font-size="14" font-weight="bold">grid line</text>

  <text x="450" y="565" text-anchor="middle" fill="#52514e" font-size="14">Line up eyes on the upper grid line, keep the face box centered, and confirm the crop before pressing the shutter.</text>
</svg>
