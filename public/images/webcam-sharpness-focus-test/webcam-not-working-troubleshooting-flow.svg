<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle2 svgDesc2">
  <title id="svgTitle2">Webcam not working troubleshooting flow</title>
  <desc id="svgDesc2">A five-step flow diagram for diagnosing why a webcam is not working: check browser camera permission, close conflicting apps, check operating system privacy settings, update webcam drivers, then check the physical connection.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Webcam not working troubleshooting flow</dc:title>
        <dc:description>A five-step flow diagram for diagnosing why a webcam is not working: check browser camera permission, close conflicting apps, check operating system privacy settings, update webcam drivers, then check the physical connection.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam not working</rdf:li>
            <rdf:li>camera permission</rdf:li>
            <rdf:li>privacy settings</rdf:li>
            <rdf:li>device manager</rdf:li>
            <rdf:li>operating system</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-sharpness-focus-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1000" height="780" fill="#fcfcfb"/>
  <text x="500" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#0b0b0b">Webcam not working? Troubleshooting flow</text>
  <text x="500" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">Work through each check in order before assuming a hardware failure</text>

  <!-- vertical connector line -->
  <line x1="150" y1="140" x2="150" y2="690" stroke="#c3c2b7" stroke-width="2"/>

  <!-- Step 1 -->
  <circle cx="150" cy="150" r="26" fill="#2a78d6"/>
  <text x="150" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <rect x="210" y="118" width="700" height="64" rx="8" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="2"/>
  <text x="234" y="145" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">Check the browser's camera permission</text>
  <text x="234" y="167" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Look for a blocked camera icon in the address bar and click Allow</text>

  <!-- Step 2 -->
  <circle cx="150" cy="260" r="26" fill="#2a78d6"/>
  <text x="150" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <rect x="210" y="228" width="700" height="64" rx="8" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="2"/>
  <text x="234" y="255" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">Close apps already using the camera</text>
  <text x="234" y="277" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Zoom, Teams, or another browser tab can hold exclusive camera access</text>

  <!-- Step 3 -->
  <circle cx="150" cy="370" r="26" fill="#2a78d6"/>
  <text x="150" y="377" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <rect x="210" y="338" width="700" height="64" rx="8" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="2"/>
  <text x="234" y="365" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">Check operating system privacy settings</text>
  <text x="234" y="387" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Confirm camera access is enabled at the OS level, not just the browser</text>

  <!-- Step 4 -->
  <circle cx="150" cy="480" r="26" fill="#2a78d6"/>
  <text x="150" y="487" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">4</text>
  <rect x="210" y="448" width="700" height="64" rx="8" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="2"/>
  <text x="234" y="475" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">Update webcam drivers</text>
  <text x="234" y="497" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Outdated drivers in Device Manager can silently block a working camera</text>

  <!-- Step 5 -->
  <circle cx="150" cy="590" r="26" fill="#2a78d6"/>
  <text x="150" y="597" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">5</text>
  <rect x="210" y="558" width="700" height="64" rx="8" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="2"/>
  <text x="234" y="585" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">Check the physical connection</text>
  <text x="234" y="607" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">Reseat the USB port, or test the webcam on another computer</text>

  <!-- Result -->
  <circle cx="150" cy="690" r="26" fill="#0ca30c"/>
  <text x="150" y="697" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff">✓</text>
  <rect x="210" y="658" width="700" height="64" rx="8" fill="#f9f9f7" stroke="#0ca30c" stroke-width="2"/>
  <text x="234" y="685" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">Re-run the webcam test</text>
  <text x="234" y="707" font-family="system-ui, sans-serif" font-size="13" fill="#52514e">If the feed still fails after every step, the hardware itself may be at fault</text>
</svg>
