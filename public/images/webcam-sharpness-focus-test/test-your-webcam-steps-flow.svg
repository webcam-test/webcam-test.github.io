<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle4 svgDesc4">
  <title id="svgTitle4">Steps to test your webcam</title>
  <desc id="svgDesc4">A four-step horizontal flow showing how to test your webcam: allow camera access, select your webcam device, run the test, then review the quality results.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Steps to test your webcam</dc:title>
        <dc:description>A four-step horizontal flow showing how to test your webcam: allow camera access, select your webcam device, run the test, then review the quality results.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>test your webcam</rdf:li>
            <rdf:li>camera access</rdf:li>
            <rdf:li>camera permission</rdf:li>
            <rdf:li>webcam test</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-sharpness-focus-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1000" height="340" fill="#fcfcfb"/>
  <text x="500" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#0b0b0b">Steps to test your webcam</text>

  <!-- connector -->
  <line x1="150" y1="185" x2="850" y2="185" stroke="#c3c2b7" stroke-width="2"/>

  <!-- Step 1 -->
  <circle cx="150" cy="185" r="30" fill="#2a78d6"/>
  <text x="150" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">1</text>
  <text x="150" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Allow camera access</text>
  <text x="150" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52514e">Click Allow when the</text>
  <text x="150" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52514e">browser prompts you</text>

  <!-- Step 2 -->
  <circle cx="383" cy="185" r="30" fill="#2a78d6"/>
  <text x="383" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">2</text>
  <text x="383" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Select your webcam</text>
  <text x="383" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52514e">Choose the right device</text>
  <text x="383" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52514e">if more than one is listed</text>

  <!-- Step 3 -->
  <circle cx="616" cy="185" r="30" fill="#2a78d6"/>
  <text x="616" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
  <text x="616" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Run the test</text>
  <text x="616" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52514e">Watch the live preview</text>
  <text x="616" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52514e">stream from your camera</text>

  <!-- Step 4 -->
  <circle cx="850" cy="185" r="30" fill="#0ca30c"/>
  <text x="850" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#ffffff">✓</text>
  <text x="850" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">Review the results</text>
  <text x="850" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52514e">Check sharpness,</text>
  <text x="850" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#52514e">lighting, and frame rate</text>
</svg>
