<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" style="width:100%;height:auto" role="img" aria-labelledby="lvlTitle lvlDesc"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:title><rdf:Alt><rdf:li xml:lang="x-default">Logarithmic sweep versus linear sweep: how test time is spent across octaves</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">A logarithmic sweep spends equal time in every octave from 20 Hz to 20 kHz. A linear sweep spends almost all of its time in the top octave and almost none in the bottom octave.</rdf:li></rdf:Alt></dc:description><Iptc4xmpExt:DigitalSourceType xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType><dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/audio-frequency-sweep-20hz-20khz</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description></rdf:RDF></metadata>
  <title id="lvlTitle">Logarithmic sweep versus linear sweep: how test time is spent across octaves</title>
  <desc id="lvlDesc">A logarithmic sweep spends equal time in every octave from 20 Hz to 20 kHz. A linear sweep spends almost all of its time in the top octave and almost none in the bottom octave.</desc>
  <rect x="0" y="0" width="1000" height="620" fill="#fcfcfb"/>

  <text x="500" y="54" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#0b0b0b">Log Sweep vs. Linear Sweep: Where the Time Goes</text>
  <text x="500" y="84" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#52514e">Same 20 Hz–20 kHz range, same total duration, very different time spent per octave</text>

  <!-- Logarithmic sweep bar -->
  <g transform="translate(80,150)">
    <rect x="-2" y="0" width="4" height="30" fill="#2a78d6"/>
    <text x="14" y="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#2a78d6">Logarithmic sweep</text>
    <text x="14" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#52514e">equal time per octave — every doubling of frequency gets the same slice</text>

    <g transform="translate(0,58)">
      <rect x="0" y="0" width="84" height="48" fill="#2a78d6" opacity="0.95"/>
      <rect x="84" y="0" width="84" height="48" fill="#2a78d6" opacity="0.82"/>
      <rect x="168" y="0" width="84" height="48" fill="#2a78d6" opacity="0.95"/>
      <rect x="252" y="0" width="84" height="48" fill="#2a78d6" opacity="0.82"/>
      <rect x="336" y="0" width="84" height="48" fill="#2a78d6" opacity="0.95"/>
      <rect x="420" y="0" width="84" height="48" fill="#2a78d6" opacity="0.82"/>
      <rect x="504" y="0" width="84" height="48" fill="#2a78d6" opacity="0.95"/>
      <rect x="588" y="0" width="84" height="48" fill="#2a78d6" opacity="0.82"/>
      <rect x="672" y="0" width="84" height="48" fill="#2a78d6" opacity="0.95"/>
      <rect x="756" y="0" width="84" height="48" fill="#2a78d6" opacity="0.82"/>
      <line x1="0" y1="0" x2="0" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="84" y1="0" x2="84" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="168" y1="0" x2="168" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="252" y1="0" x2="252" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="336" y1="0" x2="336" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="420" y1="0" x2="420" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="504" y1="0" x2="504" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="588" y1="0" x2="588" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="672" y1="0" x2="672" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="756" y1="0" x2="756" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="840" y1="0" x2="840" y2="48" stroke="#fcfcfb" stroke-width="2"/>
    </g>
  </g>

  <!-- Linear sweep bar -->
  <g transform="translate(80,300)">
    <rect x="-2" y="0" width="4" height="30" fill="#eb6834"/>
    <text x="14" y="21" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#eb6834">Linear sweep</text>
    <text x="14" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#52514e">equal time per Hz — the top octave alone eats roughly half the sweep</text>

    <g transform="translate(0,58)">
      <rect x="0.00" y="0" width="0.84" height="48" fill="#eb6834" opacity="0.95"/>
      <rect x="0.84" y="0" width="1.68" height="48" fill="#eb6834" opacity="0.82"/>
      <rect x="2.52" y="0" width="3.36" height="48" fill="#eb6834" opacity="0.95"/>
      <rect x="5.89" y="0" width="6.73" height="48" fill="#eb6834" opacity="0.82"/>
      <rect x="12.61" y="0" width="13.45" height="48" fill="#eb6834" opacity="0.95"/>
      <rect x="26.07" y="0" width="26.91" height="48" fill="#eb6834" opacity="0.82"/>
      <rect x="52.97" y="0" width="53.81" height="48" fill="#eb6834" opacity="0.95"/>
      <rect x="106.79" y="0" width="107.63" height="48" fill="#eb6834" opacity="0.82"/>
      <rect x="214.41" y="0" width="215.26" height="48" fill="#eb6834" opacity="0.95"/>
      <rect x="429.67" y="0" width="410.33" height="48" fill="#eb6834" opacity="0.82"/>
      <line x1="429.67" y1="0" x2="429.67" y2="48" stroke="#fcfcfb" stroke-width="2"/>
      <line x1="840" y1="0" x2="840" y2="48" stroke="#fcfcfb" stroke-width="2"/>
    </g>
  </g>

  <!-- shared frequency axis -->
  <g transform="translate(80,410)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#c3c2b7" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#898781" stroke-width="2"/>
    <line x1="429.67" y1="-6" x2="429.67" y2="6" stroke="#898781" stroke-width="2"/>
    <line x1="840" y1="-6" x2="840" y2="6" stroke="#898781" stroke-width="2"/>
    <text x="0" y="28" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">20 Hz</text>
    <text x="429.67" y="28" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">~10 kHz</text>
    <text x="840" y="28" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">20 kHz</text>
  </g>

  <text x="500" y="480" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">Why it matters for a frequency sweep test</text>
  <text x="500" y="508" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">A logarithmic sweep gives bass, midrange, and treble equal scrutiny — the reason most</text>
  <text x="500" y="530" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">speaker and hearing tests default to it instead of a linear ramp.</text>
</svg>
