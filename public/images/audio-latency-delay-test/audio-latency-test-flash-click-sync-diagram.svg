<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle4 svgDesc4" style="width:100%;height:auto">
  <title id="svgTitle4">How a flash and click audio latency test works</title>
  <desc id="svgDesc4">Step flow diagram showing how a flash and click synchronization audio latency test measures delay: the flash fires, the click arrives later, the slider is dragged until they feel simultaneous, and that offset becomes the reading.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>How a flash and click audio latency test works</dc:title>
        <dc:description>An audio latency test measures delay by playing a click in sync with a screen flash, then reading the offset you dial in until they feel simultaneous.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>audio latency test</rdf:li>
            <rdf:li>latency tester</rdf:li>
            <rdf:li>click</rdf:li>
            <rdf:li>flash</rdf:li>
            <rdf:li>slider</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/audio-latency-delay-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="900" height="460" fill="#fcfcfb"/>
  <text x="450" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#0b0b0b">How the flash-and-click audio latency test works</text>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#52514e">Four steps from trigger to millisecond reading</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Step 1 -->
    <circle cx="130" cy="150" r="22" fill="#2a78d6"/>
    <text x="130" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <rect x="60" y="190" width="140" height="70" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
    <text x="130" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Flash fires</text>
    <text x="130" y="234" text-anchor="middle" font-size="12" fill="#52514e">Screen flashes at</text>
    <text x="130" y="250" text-anchor="middle" font-size="12" fill="#52514e">t = 0 ms</text>

    <line x1="205" y1="225" x2="255" y2="225" stroke="#c3c2b7" stroke-width="2"/>
    <path d="M255 225 L245 219 L245 231 Z" fill="#c3c2b7"/>

    <!-- Step 2 -->
    <circle cx="335" cy="150" r="22" fill="#1baf7a"/>
    <text x="335" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <rect x="265" y="190" width="140" height="70" rx="8" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/>
    <text x="335" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Click plays</text>
    <text x="335" y="234" text-anchor="middle" font-size="12" fill="#52514e">Arrives late by the</text>
    <text x="335" y="250" text-anchor="middle" font-size="12" fill="#52514e">output latency</text>

    <line x1="410" y1="225" x2="460" y2="225" stroke="#c3c2b7" stroke-width="2"/>
    <path d="M460 225 L450 219 L450 231 Z" fill="#c3c2b7"/>

    <!-- Step 3 -->
    <circle cx="540" cy="150" r="22" fill="#eda100"/>
    <text x="540" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <rect x="470" y="190" width="140" height="70" rx="8" fill="#fcfcfb" stroke="#eda100" stroke-width="2"/>
    <text x="540" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Drag the slider</text>
    <text x="540" y="234" text-anchor="middle" font-size="12" fill="#52514e">Delay the flash until</text>
    <text x="540" y="250" text-anchor="middle" font-size="12" fill="#52514e">it feels simultaneous</text>

    <line x1="615" y1="225" x2="665" y2="225" stroke="#c3c2b7" stroke-width="2"/>
    <path d="M665 225 L655 219 L655 231 Z" fill="#c3c2b7"/>

    <!-- Step 4 -->
    <circle cx="745" cy="150" r="22" fill="#e34948"/>
    <text x="745" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
    <rect x="675" y="190" width="140" height="70" rx="8" fill="#fcfcfb" stroke="#e34948" stroke-width="2"/>
    <text x="745" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Read the result</text>
    <text x="745" y="234" text-anchor="middle" font-size="12" fill="#52514e">Slider value = your</text>
    <text x="745" y="250" text-anchor="middle" font-size="12" fill="#52514e">latency in ms</text>
  </g>

  <!-- timeline strip -->
  <line x1="60" y1="320" x2="815" y2="320" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="130" cy="320" r="7" fill="#2a78d6"/>
  <text x="130" y="345" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Flash: t = 0</text>
  <circle cx="335" cy="320" r="7" fill="#1baf7a"/>
  <text x="335" y="345" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Click: t = latency</text>
  <line x1="130" y1="320" x2="335" y2="320" stroke="#eda100" stroke-width="4"/>
  <text x="232" y="300" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">the gap the slider closes</text>

  <text x="450" y="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781">An audio latency test repeats this cycle continuously so small adjustments to the slider are easy to judge by feel</text>
</svg>
