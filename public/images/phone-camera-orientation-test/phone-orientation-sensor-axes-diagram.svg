<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 660" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Phone orientation axes diagram</title>
  <desc id="svgDesc">Labeled diagram of a smartphone showing the alpha (Z), beta (X), and gamma (Y) rotation axes read by a phone camera orientation test.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Phone orientation axes diagram</dc:title>
        <dc:description>Labeled diagram of a smartphone showing the alpha (Z), beta (X), and gamma (Y) rotation axes read by a phone camera orientation test.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>phone camera orientation test</rdf:li>
            <rdf:li>device orientation</rdf:li>
            <rdf:li>gyroscope</rdf:li>
            <rdf:li>accelerometer</rdf:li>
            <rdf:li>rotation rate</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/phone-camera-orientation-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="900" height="660" fill="#fcfcfb"/>
  <text x="450" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0b0b0b">How the three orientation axes are measured</text>
  <text x="450" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#52514e">Alpha, beta and gamma readings from a phone camera orientation test</text>

  <defs>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#eb6834"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/>
    </marker>
    <marker id="arrowAqua" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1baf7a"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c3c2b7"/>
    </marker>
  </defs>

  <!-- Top badge: Gamma -->
  <circle cx="450" cy="108" r="16" fill="#eb6834"/>
  <path d="M 442 100 A 12 12 0 1 1 441 116" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowOrange)" transform="translate(0,0)"/>
  <text x="450" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#eb6834">Gamma (Y) — side tilt</text>
  <text x="450" y="158" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">left/right roll, −90° to 90°</text>
  <line x1="450" y1="126" x2="450" y2="180" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Phone body -->
  <g transform="translate(380,186)">
    <rect x="0" y="0" width="140" height="280" rx="22" fill="#ffffff" stroke="#c3c2b7" stroke-width="2"/>
    <rect x="12" y="24" width="116" height="220" rx="4" fill="#f0efec" stroke="#e1e0d9" stroke-width="1"/>
    <circle cx="70" cy="14" r="3.5" fill="#898781"/>
    <rect x="55" y="260" width="30" height="6" rx="3" fill="#c3c2b7"/>
    <circle cx="70" cy="100" r="20" fill="none" stroke="#2a78d6" stroke-width="3"/>
    <circle cx="70" cy="100" r="8" fill="#2a78d6"/>
    <text x="70" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">camera</text>
  </g>

  <!-- Left badge: Beta -->
  <circle cx="170" cy="326" r="16" fill="#2a78d6"/>
  <path d="M 166 318 L 174 326 L 166 334" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="368" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#2a78d6">Beta (X)</text>
  <text x="170" y="386" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">forward tilt, −180° to 180°</text>
  <line x1="186" y1="326" x2="378" y2="326" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Right badge: Alpha -->
  <circle cx="730" cy="326" r="16" fill="#1baf7a"/>
  <path d="M 724 318 A 10 10 0 1 1 723 334" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <text x="730" y="368" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1baf7a">Alpha (Z)</text>
  <text x="730" y="386" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">compass rotation, 0° to 360°</text>
  <line x1="522" y1="326" x2="714" y2="326" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Legend -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="50" y="500" width="800" height="130" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
    <circle cx="78" cy="528" r="6" fill="#1baf7a"/>
    <text x="96" y="533" font-size="13" fill="#0b0b0b">Alpha near 0° or 360° — device pointing north-ish</text>
    <circle cx="78" cy="554" r="6" fill="#2a78d6"/>
    <text x="96" y="559" font-size="13" fill="#0b0b0b">Beta near 0° — device lying flat, screen up</text>
    <circle cx="78" cy="580" r="6" fill="#eb6834"/>
    <text x="96" y="585" font-size="13" fill="#0b0b0b">Gamma near 0° — no left/right roll</text>
    <text x="78" y="612" font-size="12" fill="#52514e">A frozen axis during a live tilt usually means a faulty or disconnected sensor.</text>
  </g>
</svg>
