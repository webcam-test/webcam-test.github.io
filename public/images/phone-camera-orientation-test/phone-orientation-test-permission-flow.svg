<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 420" style="width:100%;height:auto" role="img" aria-labelledby="svgTitle3 svgDesc3">
  <title id="svgTitle3">Steps to run a phone camera orientation test</title>
  <desc id="svgDesc3">A four-step flow diagram showing how a browser-based phone camera orientation test requests motion permission, then reads live gyroscope and accelerometer values as the device tilts.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Steps to run a phone camera orientation test</dc:title>
        <dc:description>A four-step flow diagram showing how a browser-based phone camera orientation test requests motion permission, then reads live gyroscope and accelerometer values as the device tilts.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>phone camera orientation test</rdf:li>
            <rdf:li>permission prompt</rdf:li>
            <rdf:li>sensor access</rdf:li>
            <rdf:li>motion sensors</rdf:li>
            <rdf:li>gyroscope</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/phone-camera-orientation-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="1100" height="420" fill="#fcfcfb"/>
  <text x="550" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0b0b0b">Running a phone camera orientation test in four steps</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Step 1 -->
    <g transform="translate(50,90)">
      <rect x="0" y="0" width="220" height="230" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="18" fill="#2a78d6"/>
      <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
      <text x="20" y="76" font-size="14" font-weight="700" fill="#0b0b0b">Open the test page</text>
      <text x="20" y="100" font-size="12" fill="#52514e">on your phone</text>
      <rect x="20" y="120" width="180" height="90" rx="8" fill="#f0efec" stroke="#e1e0d9"/>
      <rect x="36" y="134" width="148" height="14" rx="4" fill="#c3c2b7"/>
      <rect x="36" y="156" width="100" height="10" rx="3" fill="#e1e0d9"/>
      <rect x="36" y="174" width="60" height="18" rx="4" fill="#2a78d6"/>
      <text x="66" y="187" text-anchor="middle" font-size="9" fill="#ffffff">Run test</text>
    </g>

    <path d="M 280 200 L 320 200" stroke="#c3c2b7" stroke-width="3" marker-end="url(#arrowGray1)"/>

    <!-- Step 2 -->
    <g transform="translate(330,90)">
      <rect x="0" y="0" width="220" height="230" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="18" fill="#eb6834"/>
      <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
      <text x="20" y="76" font-size="14" font-weight="700" fill="#0b0b0b">Grant the motion</text>
      <text x="20" y="98" font-size="14" font-weight="700" fill="#0b0b0b">permission prompt</text>
      <rect x="20" y="120" width="180" height="90" rx="8" fill="#f0efec" stroke="#e1e0d9"/>
      <rect x="30" y="134" width="160" height="62" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
      <text x="110" y="156" text-anchor="middle" font-size="9" fill="#0b0b0b">Allow motion &amp;</text>
      <text x="110" y="168" text-anchor="middle" font-size="9" fill="#0b0b0b">orientation access?</text>
      <rect x="42" y="176" width="60" height="14" rx="4" fill="#eb6834"/>
      <text x="72" y="186" text-anchor="middle" font-size="8" fill="#ffffff">Allow</text>
    </g>

    <path d="M 560 200 L 600 200" stroke="#c3c2b7" stroke-width="3" marker-end="url(#arrowGray1)"/>

    <!-- Step 3 -->
    <g transform="translate(610,90)">
      <rect x="0" y="0" width="220" height="230" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="18" fill="#1baf7a"/>
      <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
      <text x="20" y="76" font-size="14" font-weight="700" fill="#0b0b0b">Tilt and rotate</text>
      <text x="20" y="98" font-size="14" font-weight="700" fill="#0b0b0b">the device</text>
      <g transform="translate(90,165) rotate(-25)">
        <rect x="-30" y="-55" width="60" height="110" rx="10" fill="#f0efec" stroke="#1baf7a" stroke-width="2"/>
      </g>
      <path d="M 140 140 A 30 30 0 0 1 150 175" fill="none" stroke="#1baf7a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    </g>

    <path d="M 840 200 L 880 200" stroke="#c3c2b7" stroke-width="3" marker-end="url(#arrowGray1)"/>

    <!-- Step 4 -->
    <g transform="translate(890,90)">
      <rect x="0" y="0" width="160" height="230" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="18" fill="#4a3aa7"/>
      <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
      <text x="16" y="76" font-size="14" font-weight="700" fill="#0b0b0b">Read live</text>
      <text x="16" y="98" font-size="14" font-weight="700" fill="#0b0b0b">values</text>
      <rect x="16" y="118" width="128" height="92" rx="8" fill="#f0efec" stroke="#e1e0d9"/>
      <text x="26" y="138" font-size="10" fill="#52514e">Alpha 128.4°</text>
      <text x="26" y="156" font-size="10" fill="#52514e">Beta 12.1°</text>
      <text x="26" y="174" font-size="10" fill="#52514e">Gamma -4.6°</text>
      <text x="26" y="196" font-size="10" fill="#0ca30c" font-weight="700">Sensors OK</text>
    </g>
  </g>

  <defs>
    <marker id="arrowGray1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c3c2b7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1baf7a"/>
    </marker>
  </defs>
</svg>
