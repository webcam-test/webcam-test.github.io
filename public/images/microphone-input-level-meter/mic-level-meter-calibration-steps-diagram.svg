<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
  <title>Four-step calibration workflow for a mic level meter</title>
  <desc>Step flow diagram showing how to calibrate a browser-based mic level meter against a trusted SPL meter: play a steady reference tone, read the trusted meter, enter the offset, then get an aligned dB reading.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>Four-step calibration workflow for a mic level meter</dc:title>
        <dc:description>Step flow diagram showing how to calibrate a browser-based mic level meter against a trusted SPL meter: play a steady reference tone, read the trusted meter, enter the offset, then get an aligned dB reading.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>mic level meter</rdf:li>
            <rdf:li>calibration</rdf:li>
            <rdf:li>calibration offset</rdf:li>
            <rdf:li>SPL meter</rdf:li>
            <rdf:li>1kHz tone</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/microphone-input-level-meter</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <rect x="0" y="0" width="900" height="460" fill="#fcfcfb"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0b0b0b">Calibrating Your Mic Level Meter</text>
  <text x="30" y="64" font-family="Arial, sans-serif" font-size="14" fill="#52514e">Four steps to align an uncalibrated reading with a trusted reference</text>

  <!-- Step boxes -->
  <g font-family="Arial, sans-serif">
    <!-- Step 1 -->
    <rect x="30" y="120" width="190" height="220" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <circle cx="125" cy="160" r="22" fill="#2a78d6"/>
    <text x="125" y="167" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="bold">1</text>
    <text x="125" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Play a steady tone</text>
    <text x="125" y="230" text-anchor="middle" font-size="12" fill="#52514e">Use a 1kHz test tone</text>
    <text x="125" y="248" text-anchor="middle" font-size="12" fill="#52514e">at a fixed distance</text>
    <text x="125" y="266" text-anchor="middle" font-size="12" fill="#52514e">from the mic</text>

    <!-- arrow -->
    <path d="M225 230 L260 230" stroke="#8a8981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="265" y="120" width="190" height="220" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
    <circle cx="360" cy="160" r="22" fill="#eb6834"/>
    <text x="360" y="167" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="bold">2</text>
    <text x="360" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Read a trusted meter</text>
    <text x="360" y="230" text-anchor="middle" font-size="12" fill="#52514e">Hold a calibrated SPL</text>
    <text x="360" y="248" text-anchor="middle" font-size="12" fill="#52514e">meter next to the mic</text>
    <text x="360" y="266" text-anchor="middle" font-size="12" fill="#52514e">and note its dB value</text>

    <path d="M460 230 L495 230" stroke="#8a8981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="500" y="120" width="190" height="220" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
    <circle cx="595" cy="160" r="22" fill="#1baf7a"/>
    <text x="595" y="167" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="bold">3</text>
    <text x="595" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Enter the offset</text>
    <text x="595" y="230" text-anchor="middle" font-size="12" fill="#52514e">Type that reference dB</text>
    <text x="595" y="248" text-anchor="middle" font-size="12" fill="#52514e">into the calibration</text>
    <text x="595" y="266" text-anchor="middle" font-size="12" fill="#52514e">field and confirm</text>

    <path d="M695 230 L730 230" stroke="#8a8981" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="735" y="120" width="140" height="220" rx="10" fill="#ffffff" stroke="#4a3aa7" stroke-width="2"/>
    <circle cx="805" cy="160" r="22" fill="#4a3aa7"/>
    <text x="805" y="167" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="bold">4</text>
    <text x="805" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">Aligned dB</text>
    <text x="805" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b" dy="0">reading</text>
    <text x="805" y="248" text-anchor="middle" font-size="12" fill="#52514e">Future readings</text>
    <text x="805" y="266" text-anchor="middle" font-size="12" fill="#52514e">now track the</text>
    <text x="805" y="284" text-anchor="middle" font-size="12" fill="#52514e">reference meter</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a8981"/>
    </marker>
  </defs>
</svg>
