<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wlt-diy-title wlt-diy-desc" style="width:100%;height:auto">
  <title id="wlt-diy-title">DIY webcam latency test using a stopwatch and second screen</title>
  <desc id="wlt-diy-desc">Diagram of the manual stopwatch method for a webcam latency test: a reference clock on one screen, the same clock as captured by the webcam on a second screen, and the millisecond difference between the two readings.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/">
      <rdf:Description rdf:about="">
        <dc:title>DIY webcam latency test using a stopwatch and second screen</dc:title>
        <dc:description>Diagram of the manual stopwatch method for a webcam latency test: a reference clock on one screen, the same clock as captured by the webcam on a second screen, and the millisecond difference between the two readings.</dc:description>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>webcam latency test</rdf:li>
            <rdf:li>system delay</rdf:li>
            <rdf:li>milliseconds</rdf:li>
            <rdf:li>usb webcam</rdf:li>
            <rdf:li>latency measurement</rdf:li>
          </rdf:Bag>
        </dc:subject>
        <Iptc4xmpExt:DigitalSourceType>http://cv.iptc.org/newscodes/digitalsourcetype/trainedAlgorithmicMedia</Iptc4xmpExt:DigitalSourceType>
      <dc:creator><rdf:Seq><rdf:li>WebcamTest</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 WebcamTest — webcam-test.github.io</rdf:li></rdf:Alt></dc:rights><dc:source>https://webcam-test.github.io/webcam-latency-delay-test</dc:source><xmpRights:WebStatement xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/">https://webcam-test.github.io/terms</xmpRights:WebStatement></rdf:Description>
    </rdf:RDF>
  </metadata>

  <style>
    .heading { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; fill: #0b0b0b; }
    .sub { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; fill: #52514e; }
    .screen-label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #0b0b0b; text-anchor: middle; }
    .clock { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 34px; font-weight: 700; fill: #fcfcfb; text-anchor: middle; }
    .step { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #52514e; }
  </style>

  <rect x="0" y="0" width="900" height="560" fill="#f9f9f7"/>
  <text x="40" y="50" class="heading">Measuring webcam latency with two screens</text>
  <text x="40" y="76" class="sub">A simple way to check camera delay without any software</text>

  <!-- Reference screen -->
  <g>
    <text x="200" y="120" class="screen-label">1. Reference display</text>
    <rect x="80" y="140" width="240" height="140" rx="10" fill="#0b0b0b"/>
    <text x="200" y="220" class="clock">14:22:05.812</text>
    <text x="200" y="300" class="step" text-anchor="middle">A millisecond stopwatch on a phone or tablet</text>
  </g>

  <!-- Camera pointed at screen -->
  <g>
    <circle cx="450" cy="210" r="34" fill="#2a78d6"/>
    <text x="450" y="217" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fcfcfb">Webcam</text>
    <path d="M320,210 L410,210" stroke="#898781" stroke-width="2" marker-end="url(#arrow2)"/>
    <path d="M490,210 L580,210" stroke="#898781" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#898781"/>
    </marker>
  </defs>

  <!-- Captured screen -->
  <g>
    <text x="700" y="120" class="screen-label">2. Captured feed on a monitor</text>
    <rect x="580" y="140" width="240" height="140" rx="10" fill="#0b0b0b"/>
    <text x="700" y="220" class="clock">14:22:05.674</text>
    <text x="700" y="300" class="step" text-anchor="middle">The same clock, as your webcam shows it</text>
  </g>

  <!-- delta -->
  <g>
    <rect x="260" y="340" width="380" height="80" rx="10" fill="#eb6834"/>
    <text x="450" y="390" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#fcfcfb">Δ = 138 ms latency</text>
  </g>

  <!-- steps -->
  <g>
    <text x="60" y="460" class="step" font-weight="600" fill="#0b0b0b">Steps</text>
    <text x="60" y="485" class="step">1. Start a millisecond stopwatch on a second device next to your webcam</text>
    <text x="60" y="507" class="step">2. Aim the webcam at the stopwatch and photograph both screens together</text>
    <text x="60" y="529" class="step">3. Subtract the captured time from the reference time to get the delay</text>
  </g>
</svg>
